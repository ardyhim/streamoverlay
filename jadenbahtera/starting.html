<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARTING // Bitmap Dithering Overlay</title>
  <style>
    :root {
      --bg: #b9bcff;
      --ink: #000000;
      --chat-bg: var(--bg);
      --border-w: 0.125rem;
    }

    html[data-theme="dark"] {
      --bg: #0b0b10;
      --ink: #b9bcff;
    }

    html[data-bg="transparent"] {
      --bg: transparent;
    }

    html[data-chat-bg="dark"] {
      --chat-bg: #0b0b10;
    }

    html[data-chat-bg="light"] {
      --chat-bg: #b9bcff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      grid-template-columns: 6.5rem minmax(0, 1fr) 44rem;
      overflow: hidden;
    }

    html[data-chat-cutout="1"] .scene {
      background: transparent;
    }

    /* 1-bit Bayer Checkerboard Trim */
    .dither-trim {
      position: absolute;
      left: 0;
      right: 0;
      height: 0.5rem;
      z-index: 6;
      pointer-events: none;
      background-image: conic-gradient(
        var(--ink) 90deg,
        transparent 90deg 180deg,
        var(--ink) 180deg 270deg,
        transparent 270deg
      );
      background-size: 0.5rem 0.5rem;
    }

    .dither-trim--top {
      top: 0;
    }

    .dither-trim--bottom {
      bottom: 0;
    }

    /* Left Vertical Editorial Rail */
    .left-rail {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 0.75rem 3rem 1.35rem;
      border-right: var(--border-w) solid var(--ink);
      user-select: none;
    }

    .rail-pills {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    .v-pill {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.85rem 0.42rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .rail-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
    }

    .rail-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.05;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .rail-plus {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1;
    }

    /* Center Workspace (Top bar + Split Main/Chat Body) */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 3rem 2.5rem;
      min-width: 0;
      height: 100%;
      gap: 2rem;
    }

    .top-bar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      height: 2.75rem;
      flex-wrap: nowrap;
      border-bottom: var(--border-w) solid var(--ink);
      padding-bottom: 0.9rem;
      flex-shrink: 0;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .pixel-pulse {
      width: 0.875rem;
      height: 0.875rem;
      flex-shrink: 0;
      background: var(--ink);
      animation: bit-blink 1.2s steps(2, start) infinite;
    }

    @keyframes bit-blink {
      0% { opacity: 1; }
      50% { opacity: 0.18; }
      100% { opacity: 1; }
    }

    .status-label {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .streamer-chip {
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.36rem 1.05rem;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 2-Column Stage Body: Left Hero+Timer + Right Chat Slot */
    .stage-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 24.5rem;
      gap: 2rem;
      align-items: stretch;
    }

    .stage-body.no-chat {
      grid-template-columns: minmax(0, 1fr);
    }

    .stage-main {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      height: 100%;
      gap: 1.5rem;
    }

    /* Center Hero Title & Countdown */
    .hero-block {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin: auto 0;
      padding: 0.5rem 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      height: 1.4rem;
      flex-wrap: nowrap;
    }

    .crosshair {
      display: inline-block;
      font-weight: 800;
    }

    .headline {
      margin: 0;
      font-size: 6rem;
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.88;
      text-transform: uppercase;
      word-break: break-word;
    }

    .stage-body.no-chat .headline {
      font-size: 8.2rem;
    }

    .headline.is-medium {
      font-size: 4.8rem;
    }

    .stage-body.no-chat .headline.is-medium {
      font-size: 6.4rem;
    }

    .headline.is-long {
      font-size: 3.8rem;
      line-height: 0.92;
    }

    .stage-body.no-chat .headline.is-long {
      font-size: 4.9rem;
    }

    /* Countdown Module */
    .timer-module {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      width: 100%;
    }

    .timer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 1.4rem;
      flex-wrap: nowrap;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .timer-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: nowrap;
    }

    .timer-digits {
      font-size: 5.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stage-body.no-chat .timer-digits {
      font-size: 6.4rem;
    }

    .vu-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .vu-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #vu-canvas {
      width: 7rem;
      height: 2.1rem;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .dither-bar-frame {
      width: 100%;
      padding: 0.3rem;
      border: var(--border-w) solid var(--ink);
      background: var(--bg);
    }

    #dither-progress {
      width: 100%;
      height: 1.45rem;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Footer Metadata & Socials */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-top: var(--border-w) solid var(--ink);
      padding-top: 0.95rem;
      min-height: 3rem;
      flex-wrap: nowrap;
    }

    .pill-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.3rem 0.82rem;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
      height: 2rem;
    }

    .pill--solid {
      background: var(--ink);
      color: var(--bg);
    }

    .coord-text {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Right Chat Panel (Switchable: YouTube Iframe + Theme Blend / OBS Box Chat) */
    .chat-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      border: var(--border-w) solid var(--ink);
    }

    .chat-panel.is-hidden {
      display: none;
    }

    .chat-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.9rem;
      border-bottom: var(--border-w) solid var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      height: 2.35rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
      background: var(--bg);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      white-space: nowrap;
    }

    .chat-dot {
      width: 0.55rem;
      height: 0.55rem;
      background: var(--ink);
      flex-shrink: 0;
    }

    .chat-mode-tag {
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.14rem 0.55rem;
      font-size: 0.72rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    .chat-body {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: var(--chat-bg);
      overflow: hidden;
      isolation: isolate;
    }

    html[data-chat-cutout="1"] .chat-body {
      background: transparent;
      box-shadow: 0 0 0 400rem var(--bg);
      overflow: visible;
    }

    .chat-tint-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
      overflow: hidden;
    }

    .chat-panel[data-mode="iframe"] .chat-tint-wrap {
      display: block;
    }

    .chat-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    html[data-chat-crop="1"] .chat-iframe {
      height: calc(100% + 7rem);
      margin-top: -3rem;
    }
    html[data-chat-crop="2"] .chat-iframe {
      height: calc(100% + 9rem);
      margin-top: -3rem;
    }
    html[data-chat-crop="3"] .chat-iframe {
      height: calc(100% + 11rem);
      margin-top: -3rem;
    }

    /* Styling tema 1-bit otomatis untuk YouTube Live Chat iframe */
    html[data-iframe-tone="light"] .chat-iframe {
      filter: grayscale(100%) contrast(155%) brightness(106%);
      mix-blend-mode: multiply;
    }

    html[data-iframe-tone="dark"] .chat-tint-wrap {
      isolation: isolate;
      mix-blend-mode: screen;
    }

    html[data-iframe-tone="dark"] .chat-iframe {
      filter: grayscale(100%) contrast(155%) brightness(92%);
    }

    .chat-tint-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    html[data-iframe-tone="dark"] .chat-tint-overlay {
      display: block;
      background: #b9bcff;
      mix-blend-mode: multiply;
    }

    .chat-box-guides {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    .chat-panel[data-mode="box"] .chat-box-guides {
      display: block;
    }

    .box-mark {
      position: absolute;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      opacity: 0.55;
      user-select: none;
    }

    .box-mark--tl { top: 0.55rem; left: 0.7rem; }
    .box-mark--tr { top: 0.55rem; right: 0.7rem; }
    .box-mark--bl { bottom: 0.55rem; left: 0.7rem; }
    .box-mark--br { bottom: 0.55rem; right: 0.7rem; }

    .chat-footer {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.9rem;
      border-top: var(--border-w) solid var(--ink);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      height: 2rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
      background: var(--bg);
    }

    /* Right Hero Bitmap Dithering Portrait */
    .portrait-panel {
      position: relative;
      z-index: 3;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }

    #portrait-canvas {
      width: 100%;
      height: auto;
      max-height: 100%;
      aspect-ratio: 10/16;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Responsive Fallback for Portrait / Square OBS Canvases */
    @media (max-aspect-ratio: 5/4) {
      .scene {
        grid-template-columns: 5.5rem minmax(0, 1fr);
      }

      .portrait-panel {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 58%;
        height: 55%;
        opacity: 0.2;
        z-index: 1;
        pointer-events: none;
      }

      .stage {
        padding: 2.75rem 2rem;
      }

      .stage-body {
        grid-template-columns: minmax(0, 1fr);
      }

      .chat-panel {
        height: 18rem;
      }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="dither-trim dither-trim--top"></div>
    <div class="dither-trim dither-trim--bottom"></div>

    <!-- Left Editorial Rail -->
    <aside class="left-rail">
      <div class="rail-pills mono">
        <span class="v-pill" id="res-pill">1920X1080</span>
        <span class="v-pill">1-BIT</span>
        <span class="v-pill">DITHER</span>
      </div>

      <div class="rail-stack">
        <span class="rail-text" id="rail-sub">ATKINSON_DITHERING</span>
        <span class="rail-text" id="rail-brand">BITMAP_CREATOR</span>
        <span class="rail-plus">+</span>
      </div>
    </aside>

    <!-- Center Workspace -->
    <main class="stage">
      <header class="top-bar">
        <div class="status-group">
          <span class="pixel-pulse" id="pulse-dot"></span>
          <span class="status-label mono" id="status-text">SIGNAL_STANDBY // INIT</span>
        </div>
        <div class="streamer-chip mono" id="streamer-chip">@BITMAP_STUDIO</div>
      </header>

      <div class="stage-body" id="stage-body">
        <div class="stage-main">
          <section class="hero-block">
            <div class="eyebrow mono">
              <span class="crosshair">+</span>
              <span id="eyebrow-text">SCENE_01 // BROADCAST_QUEUE</span>
            </div>

            <h1 class="headline" id="scene-title">STARTING</h1>

            <div class="timer-module">
              <div class="timer-meta mono">
                <span id="timer-caption">T-MINUS_COUNTDOWN</span>
                <span id="progress-pct">100%</span>
              </div>

              <div class="timer-row">
                <div class="timer-digits mono" id="timer-display">05:00</div>
                <div class="vu-wrap">
                  <span class="vu-label mono">SYNC_SIGNAL</span>
                  <canvas id="vu-canvas" width="48" height="16"></canvas>
                </div>
              </div>

              <div class="dither-bar-frame">
                <canvas id="dither-progress" width="240" height="8"></canvas>
              </div>
            </div>
          </section>

          <footer class="bottom-bar">
            <div class="pill-row mono" id="social-row"></div>
            <div class="coord-text mono" id="clock-text">SYNC // 60FPS</div>
          </footer>
        </div>

        <!-- Right Switchable Chat Slot (YouTube Iframe / OBS Box Chat) -->
        <aside class="chat-panel" id="chat-panel" data-mode="box">
          <div class="chat-header mono">
            <div class="chat-header-left">
              <span class="chat-dot"></span>
              <span id="chat-title">LIVE_CHAT // FEED</span>
            </div>
            <span class="chat-mode-tag" id="chat-mode-tag">OBS_BOX</span>
          </div>

          <div class="chat-body" id="chat-body">
            <div class="chat-tint-wrap">
              <iframe id="chat-iframe" class="chat-iframe" allow="autoplay"></iframe>
              <div class="chat-tint-overlay" aria-hidden="true"></div>
            </div>
            <div class="chat-box-guides mono" aria-hidden="true">
              <span class="box-mark box-mark--tl">+</span>
              <span class="box-mark box-mark--tr">+</span>
              <span class="box-mark box-mark--bl">+</span>
              <span class="box-mark box-mark--br">+</span>
            </div>
          </div>

          <div class="chat-footer mono">
            <span id="chat-foot-left">SLOT_READY</span>
            <span id="chat-foot-right">1-BIT_FRAME</span>
          </div>
        </aside>
      </div>
    </main>

    <!-- Right Hero 1-Bit Dithered Portrait -->
    <section class="portrait-panel" aria-hidden="true">
      <canvas id="portrait-canvas" width="162" height="200"></canvas>
    </section>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      const theme = (params.get("theme") || "light").toLowerCase();
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }

      if ((params.get("bg") || "").toLowerCase() === "transparent") {
        document.documentElement.setAttribute("data-bg", "transparent");
      }

      const chatBgParam = (params.get("chatBg") || "").toLowerCase();
      if (chatBgParam === "dark" || chatBgParam === "light") {
        document.documentElement.setAttribute("data-chat-bg", chatBgParam);
      }

      if (params.get("chatCrop") === "1") {
        document.documentElement.setAttribute("data-chat-crop", "1");
      }
      if (params.get("chatCrop") === "2") {
        document.documentElement.setAttribute("data-chat-crop", "2");
      }
      if (params.get("chatCrop") === "3") {
        document.documentElement.setAttribute("data-chat-crop", "3");
      }

      const titleParam = (params.get("title") || "STARTING").trim().toUpperCase();
      const streamerParam = (params.get("streamer") || "").trim();
      const igParam = (params.get("ig") || "").trim().replace(/^@/, "");
      const ttParam = (params.get("tt") || "").trim().replace(/^@/, "");
      const ytParam = (params.get("yt") || "").trim().replace(/^@/, "");
      const chatIdParam = (params.get("chatId") || "").trim();
      const chatParam = (params.get("chat") || params.get("chatMode") || "").trim().toLowerCase();
      const imgParam = (params.get("img") || "").trim();

      const rawMinus = params.get("minus");
      const minutes = rawMinus !== null && !isNaN(parseFloat(rawMinus))
        ? Math.max(0, parseFloat(rawMinus))
        : 5;

      // Responsive root scale using pure rem without vh/vw
      function updateScale() {
        const w = window.innerWidth || 1920;
        const h = window.innerHeight || 1080;
        const scale = Math.min(w / 1920, h / 1080);
        const remPx = Math.max(7, 16 * scale);
        document.documentElement.style.fontSize = remPx.toFixed(2) + "px";
        const resPill = document.getElementById("res-pill");
        if (resPill) {
          resPill.textContent = w + "X" + h;
        }
      }
      updateScale();
      window.addEventListener("resize", updateScale);

      // Chat Mode Controller: "none" | "box" | "iframe"
      const stageBody = document.getElementById("stage-body");
      const chatPanel = document.getElementById("chat-panel");
      const chatIframe = document.getElementById("chat-iframe");
      const chatModeTag = document.getElementById("chat-mode-tag");
      const chatFootLeft = document.getElementById("chat-foot-left");

      let resolvedChatMode = "box";
      if (chatParam === "none" || chatParam === "off" || chatParam === "hide") {
        resolvedChatMode = "none";
      } else if (chatParam === "box") {
        resolvedChatMode = "box";
      } else if (chatIdParam) {
        resolvedChatMode = "iframe";
      }

      const isDarkChat =
        (theme === "dark" && chatBgParam !== "light") || chatBgParam === "dark";

      if (resolvedChatMode === "none") {
        chatPanel.classList.add("is-hidden");
        stageBody.classList.add("no-chat");
      } else if (resolvedChatMode === "iframe" && chatIdParam) {
        chatPanel.setAttribute("data-mode", "iframe");
        chatModeTag.textContent = "YOUTUBE";
        chatFootLeft.textContent = "LIVE_EMBED";
        document.documentElement.setAttribute(
          "data-iframe-tone",
          isDarkChat ? "dark" : "light"
        );
        const domain = window.location.hostname || "localhost";
        chatIframe.src =
          "https://www.youtube.com/live_chat?is_popout=1" +
          (isDarkChat ? "&dark_theme=1" : "") +
          "&v=" +
          encodeURIComponent(chatIdParam) +
          "&embed_domain=" +
          encodeURIComponent(domain);
      } else {
        chatPanel.setAttribute("data-mode", "box");
        if (chatBgParam === "transparent") {
          document.documentElement.setAttribute("data-chat-cutout", "1");
          chatModeTag.textContent = "OBS_HOLE";
          chatFootLeft.textContent = "ALPHA_CUTOUT";
        } else {
          chatModeTag.textContent = "OBS_BOX";
          chatFootLeft.textContent = "LAYER_ABOVE";
        }
      }

      // Title & Streamer Setup
      const titleEl = document.getElementById("scene-title");
      titleEl.textContent = titleParam;
      if (titleParam.length > 14) {
        titleEl.classList.add("is-long");
      } else if (titleParam.length > 9) {
        titleEl.classList.add("is-medium");
      }

      const streamerChip = document.getElementById("streamer-chip");
      const railBrand = document.getElementById("rail-brand");
      if (streamerParam) {
        const cleanStreamer = streamerParam.replace(/^@/, "").toUpperCase();
        streamerChip.textContent = "@" + cleanStreamer;
        railBrand.textContent = cleanStreamer.replace(/\s+/g, "_");
      }

      // Social Pills or Default Bitmap Badges
      const socialRow = document.getElementById("social-row");
      const socials = [];
      if (igParam) socials.push({ tag: "IG", val: "@" + igParam.toUpperCase() });
      if (ttParam) socials.push({ tag: "TT", val: "@" + ttParam.toUpperCase() });
      if (ytParam) socials.push({ tag: "YT", val: "@" + ytParam.toUpperCase() });

      if (socials.length > 0) {
        socials.forEach(function (s, idx) {
          const el = document.createElement("span");
          el.className = idx === 0 ? "pill pill--solid" : "pill";
          el.textContent = s.tag + " / " + s.val;
          socialRow.appendChild(el);
        });
      } else {
        ["BIT_DEPTH: 1", "BAYER_4X4", "ATKINSON"].forEach(function (label, idx) {
          const el = document.createElement("span");
          el.className = idx === 0 ? "pill pill--solid" : "pill";
          el.textContent = label;
          socialRow.appendChild(el);
        });
      }

      // Color helpers synced to CSS theme
      function getInkRGB() {
        const cs = getComputedStyle(document.documentElement);
        const hex = cs.getPropertyValue("--ink").trim();
        if (hex.startsWith("#") && hex.length === 7) {
          return [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16)
          ];
        }
        return [0, 0, 0];
      }

      // 4x4 Ordered Bayer Matrix
      const BAYER4 = [
        [ 0,  8,  2, 10],
        [12,  4, 14,  6],
        [ 3, 11,  1,  9],
        [15,  7, 13,  5]
      ];

      // Countdown + Bayer Dither Progress Bar
      const totalSeconds = Math.round(minutes * 60);
      let remaining = totalSeconds;
      const timerDisplay = document.getElementById("timer-display");
      const progressPct = document.getElementById("progress-pct");
      const statusText = document.getElementById("status-text");
      const timerCaption = document.getElementById("timer-caption");
      const progressCanvas = document.getElementById("dither-progress");
      const progressCtx = progressCanvas.getContext("2d");
      progressCtx.imageSmoothingEnabled = false;

      function formatTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const remS = s % 60;
        const pad = function (n) { return n < 10 ? "0" + n : String(n); };
        return hrs > 0 ? pad(hrs) + ":" + pad(mins) + ":" + pad(remS) : pad(mins) + ":" + pad(remS);
      }

      function renderDitherProgress(ratio) {
        const w = progressCanvas.width;
        const h = progressCanvas.height;
        const ink = getInkRGB();
        const imgData = progressCtx.createImageData(w, h);
        const data = imgData.data;

        const clamped = Math.max(0, Math.min(1, ratio));
        const fillX = clamped * w;
        const feather = 28;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            let density = 0;
            if (x < fillX - feather * 0.5) {
              density = 1;
            } else if (x > fillX + feather * 0.5) {
              density = 0;
            } else {
              density = 1 - (x - (fillX - feather * 0.5)) / feather;
            }

            const threshold = (BAYER4[y & 3][x & 3] + 0.5) / 16;
            if (density > threshold && clamped > 0) {
              data[idx] = ink[0];
              data[idx + 1] = ink[1];
              data[idx + 2] = ink[2];
              data[idx + 3] = 255;
            } else {
              data[idx + 3] = 0;
            }
          }
        }
        progressCtx.putImageData(imgData, 0, 0);
      }

      const startMs = performance.now();
      function updateCountdown() {
        const elapsed = (performance.now() - startMs) / 1000;
        remaining = Math.max(0, totalSeconds - elapsed);
        timerDisplay.textContent = formatTime(Math.ceil(remaining));

        const ratio = totalSeconds > 0 ? remaining / totalSeconds : 0;
        const pct = Math.round(ratio * 100);
        progressPct.textContent = (pct < 10 ? "0" + pct : pct) + "%";
        renderDitherProgress(totalSeconds > 0 ? ratio : 1);

        if (remaining <= 0) {
          statusText.textContent = "SIGNAL_LOCKED // LIVE_IMMINENT";
          timerCaption.textContent = "STREAM_STARTING_NOW";
          timerDisplay.textContent = "00:00";
        }
      }
      updateCountdown();
      setInterval(updateCountdown, 250);

      // 1-Bit Pixel VU Signal Visualizer
      const vuCanvas = document.getElementById("vu-canvas");
      const vuCtx = vuCanvas.getContext("2d");
      vuCtx.imageSmoothingEnabled = false;
      const vuBars = 12;
      const vuHeights = new Array(vuBars).fill(4);

      function renderVU(tick) {
        const w = vuCanvas.width;
        const h = vuCanvas.height;
        const ink = getInkRGB();
        const imgData = vuCtx.createImageData(w, h);
        const data = imgData.data;

        for (let i = 0; i < vuBars; i++) {
          const wave = Math.sin(tick * 0.35 + i * 0.72) * 0.5 + 0.5;
          const wave2 = Math.cos(tick * 0.21 - i * 1.1) * 0.5 + 0.5;
          vuHeights[i] = Math.max(2, Math.round((wave * 0.65 + wave2 * 0.35) * (h - 2)));
        }

        for (let y = 0; y < h; y++) {
          const rowFromBottom = h - 1 - y;
          for (let i = 0; i < vuBars; i++) {
            const barH = vuHeights[i];
            const bx = i * 4;
            for (let dx = 0; dx < 3; dx++) {
              const x = bx + dx;
              if (x >= w) continue;
              const idx = (y * w + x) * 4;
              if (rowFromBottom < barH) {
                const isTip = rowFromBottom >= barH - 2;
                const ditherPass = !isTip || ((x + y) % 2 === 0);
                if (ditherPass) {
                  data[idx] = ink[0];
                  data[idx + 1] = ink[1];
                  data[idx + 2] = ink[2];
                  data[idx + 3] = 255;
                }
              }
            }
          }
        }
        vuCtx.putImageData(imgData, 0, 0);
      }

      let vuTick = 0;
      renderVU(vuTick);
      setInterval(function () {
        vuTick++;
        renderVU(vuTick);
      }, 140);

      const portraitCanvas = document.getElementById("portrait-canvas");
      const pCtx = portraitCanvas.getContext("2d");
      pCtx.imageSmoothingEnabled = false;
      const PW = portraitCanvas.width;
      const PH = portraitCanvas.height;

      const bitMask = new Uint8Array(PW * PH);
      let sparseEdgeIndices = [];

      function buildEdgeCache() {
        sparseEdgeIndices = [];
        for (let y = 1; y < PH - 1; y++) {
          for (let x = 1; x < PW - 1; x++) {
            const i = y * PW + x;
            if (bitMask[i] === 1) {
              const neighbors =
                bitMask[i - 1] + bitMask[i + 1] + bitMask[i - PW] + bitMask[i + PW];
              if (neighbors <= 1) {
                sparseEdgeIndices.push(i);
              }
            }
          }
        }
      }

      function renderPortraitFrame(revealRatio, shimmerTick) {
        const ink = getInkRGB();
        const imgData = pCtx.createImageData(PW, PH);
        const data = imgData.data;

        for (let y = 0; y < PH; y++) {
          for (let x = 0; x < PW; x++) {
            const i = y * PW + x;
            if (bitMask[i] === 1) {
              if (revealRatio < 1) {
                const threshold = (BAYER4[y & 3][x & 3] + 0.5) / 16;
                if (revealRatio <= threshold) continue;
              }
              const idx = i * 4;
              data[idx] = ink[0];
              data[idx + 1] = ink[1];
              data[idx + 2] = ink[2];
              data[idx + 3] = 255;
            }
          }
        }

        if (revealRatio >= 1 && sparseEdgeIndices.length > 0) {
          const len = sparseEdgeIndices.length;
          for (let k = 0; k < 24; k++) {
            const pick = sparseEdgeIndices[(shimmerTick * 37 + k * 97) % len];
            const idx = pick * 4;
            data[idx + 3] = 0;
          }
        }

        pCtx.putImageData(imgData, 0, 0);
      }

      function startPortraitAnimation() {
        buildEdgeCache();
        const introStart = performance.now();
        const introDuration = 900;
        let lastShimmer = 0;
        let shimmerTick = 0;

        function loop(now) {
          const elapsed = now - introStart;
          if (elapsed < introDuration) {
            renderPortraitFrame(elapsed / introDuration, 0);
            requestAnimationFrame(loop);
          } else {
            if (now - lastShimmer > 180) {
              lastShimmer = now;
              shimmerTick++;
              renderPortraitFrame(1, shimmerTick);
            }
            requestAnimationFrame(loop);
          }
        }
        requestAnimationFrame(loop);
      }

      function loadEmbeddedBitmap() {
        const img = new Image();
        img.onload = function () {
          const off = document.createElement("canvas");
          off.width = PW;
          off.height = PH;
          const oCtx = off.getContext("2d");
          oCtx.imageSmoothingEnabled = false;
          oCtx.drawImage(img, 0, 0, PW, PH);
          const raw = oCtx.getImageData(0, 0, PW, PH).data;
          for (let i = 0; i < PW * PH; i++) {
            bitMask[i] = raw[i * 4 + 3] > 127 ? 1 : 0;
          }
          startPortraitAnimation();
        };
        img.src = EMBEDDED_PORTRAIT_B64;
      }

      function loadCustomImageDithered(url) {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function () {
          try {
            const off = document.createElement("canvas");
            off.width = PW;
            off.height = PH;
            const oCtx = off.getContext("2d");

            const scale = Math.max(PW / img.width, PH / img.height);
            const dw = img.width * scale;
            const dh = img.height * scale;
            const dx = (PW - dw) / 2;
            const dy = (PH - dh) / 2;

            oCtx.fillStyle = "#ffffff";
            oCtx.fillRect(0, 0, PW, PH);
            oCtx.drawImage(img, dx, dy, dw, dh);

            const pixels = oCtx.getImageData(0, 0, PW, PH).data;
            const gray = new Float32Array(PW * PH);
            for (let i = 0; i < PW * PH; i++) {
              gray[i] =
                0.299 * pixels[i * 4] +
                0.587 * pixels[i * 4 + 1] +
                0.114 * pixels[i * 4 + 2];
            }

            for (let y = 0; y < PH; y++) {
              for (let x = 0; x < PW; x++) {
                const i = y * PW + x;
                const oldVal = gray[i];
                const newVal = oldVal < 128 ? 0 : 255;
                bitMask[i] = newVal === 0 ? 1 : 0;
                const err = (oldVal - newVal) / 8;

                if (x + 1 < PW) gray[i + 1] += err;
                if (x + 2 < PW) gray[i + 2] += err;
                if (y + 1 < PH) {
                  if (x - 1 >= 0) gray[i + PW - 1] += err;
                  gray[i + PW] += err;
                  if (x + 1 < PW) gray[i + PW + 1] += err;
                }
                if (y + 2 < PH) {
                  gray[i + PW * 2] += err;
                }
              }
            }
            startPortraitAnimation();
          } catch (e) {
            loadEmbeddedBitmap();
          }
        };
        img.onerror = loadEmbeddedBitmap;
        img.src = url;
      }

      if (imgParam) {
        loadCustomImageDithered(imgParam);
      } else {
        loadEmbeddedBitmap();
      }
    })();
