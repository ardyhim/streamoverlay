<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARTING // Bitmap Dithering Overlay</title>
  <style>
    :root {
      --bg: #b9bcff;
      --ink: #000000;
      --chat-bg: var(--bg);
      --border-w: 0.125rem;
    }

    html[data-theme="dark"] {
      --bg: #0b0b10;
      --ink: #b9bcff;
    }

    html[data-bg="transparent"] {
      --bg: transparent;
    }

    html[data-chat-bg="dark"] {
      --chat-bg: #0b0b10;
    }

    html[data-chat-bg="light"] {
      --chat-bg: #b9bcff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      grid-template-columns: 6.5rem minmax(0, 1fr) 44rem;
      overflow: hidden;
    }

    html[data-chat-cutout="1"] .scene {
      background: transparent;
    }

    /* 1-bit Bayer Checkerboard Trim */
    .dither-trim {
      position: absolute;
      left: 0;
      right: 0;
      height: 0.5rem;
      z-index: 6;
      pointer-events: none;
      background-image: conic-gradient(
        var(--ink) 90deg,
        transparent 90deg 180deg,
        var(--ink) 180deg 270deg,
        transparent 270deg
      );
      background-size: 0.5rem 0.5rem;
    }

    .dither-trim--top {
      top: 0;
    }

    .dither-trim--bottom {
      bottom: 0;
    }

    /* Left Vertical Editorial Rail */
    .left-rail {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 0.75rem 3rem 1.35rem;
      border-right: var(--border-w) solid var(--ink);
      user-select: none;
    }

    .rail-pills {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    .v-pill {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.85rem 0.42rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .rail-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
    }

    .rail-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.05;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .rail-plus {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1;
    }

    /* Center Workspace (Top bar + Split Main/Chat Body) */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 3rem 2.5rem;
      min-width: 0;
      height: 100%;
      gap: 2rem;
    }

    .top-bar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      height: 2.75rem;
      flex-wrap: nowrap;
      border-bottom: var(--border-w) solid var(--ink);
      padding-bottom: 0.9rem;
      flex-shrink: 0;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .pixel-pulse {
      width: 0.875rem;
      height: 0.875rem;
      flex-shrink: 0;
      background: var(--ink);
      animation: bit-blink 1.2s steps(2, start) infinite;
    }

    @keyframes bit-blink {
      0% { opacity: 1; }
      50% { opacity: 0.18; }
      100% { opacity: 1; }
    }

    .status-label {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .streamer-chip {
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.36rem 1.05rem;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 2-Column Stage Body: Left Hero+Timer + Right Chat Slot */
    .stage-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 24.5rem;
      gap: 2rem;
      align-items: stretch;
    }

    .stage-body.no-chat {
      grid-template-columns: minmax(0, 1fr);
    }

    .stage-main {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      height: 100%;
      gap: 1.5rem;
    }

    /* Center Hero Title & Countdown */
    .hero-block {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin: auto 0;
      padding: 0.5rem 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      height: 1.4rem;
      flex-wrap: nowrap;
    }

    .crosshair {
      display: inline-block;
      font-weight: 800;
    }

    .headline {
      margin: 0;
      font-size: 6rem;
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.88;
      text-transform: uppercase;
      word-break: break-word;
    }

    .stage-body.no-chat .headline {
      font-size: 8.2rem;
    }

    .headline.is-medium {
      font-size: 4.8rem;
    }

    .stage-body.no-chat .headline.is-medium {
      font-size: 6.4rem;
    }

    .headline.is-long {
      font-size: 3.8rem;
      line-height: 0.92;
    }

    .stage-body.no-chat .headline.is-long {
      font-size: 4.9rem;
    }

    /* Countdown Module */
    .timer-module {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      width: 100%;
    }

    .timer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 1.4rem;
      flex-wrap: nowrap;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .timer-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: nowrap;
    }

    .timer-digits {
      font-size: 5.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.9;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .stage-body.no-chat .timer-digits {
      font-size: 6.4rem;
    }

    .vu-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .vu-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #vu-canvas {
      width: 7rem;
      height: 2.1rem;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .dither-bar-frame {
      width: 100%;
      padding: 0.3rem;
      border: var(--border-w) solid var(--ink);
      background: var(--bg);
    }

    #dither-progress {
      width: 100%;
      height: 1.45rem;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Footer Metadata & Socials */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-top: var(--border-w) solid var(--ink);
      padding-top: 0.95rem;
      min-height: 3rem;
      flex-wrap: nowrap;
    }

    .pill-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.3rem 0.82rem;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      white-space: nowrap;
      height: 2rem;
    }

    .pill--solid {
      background: var(--ink);
      color: var(--bg);
    }

    .coord-text {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Right Chat Panel (Switchable: YouTube Iframe + Theme Blend / OBS Box Chat) */
    .chat-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      border: var(--border-w) solid var(--ink);
    }

    .chat-panel.is-hidden {
      display: none;
    }

    .chat-header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.9rem;
      border-bottom: var(--border-w) solid var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      height: 2.35rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
      background: var(--bg);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
      white-space: nowrap;
    }

    .chat-dot {
      width: 0.55rem;
      height: 0.55rem;
      background: var(--ink);
      flex-shrink: 0;
    }

    .chat-mode-tag {
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 0.14rem 0.55rem;
      font-size: 0.72rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    .chat-body {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      width: 100%;
      background: var(--chat-bg);
      overflow: hidden;
      isolation: isolate;
    }

    html[data-chat-cutout="1"] .chat-body {
      background: transparent;
      box-shadow: 0 0 0 400rem var(--bg);
      overflow: visible;
    }

    .chat-tint-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
      overflow: hidden;
    }

    .chat-panel[data-mode="iframe"] .chat-tint-wrap {
      display: block;
    }

    .chat-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    html[data-chat-crop="1"] .chat-iframe {
      height: calc(100% + 7rem);
      margin-top: -3rem;
    }

    html[data-iframe-tone="light"] .chat-iframe {
      filter: grayscale(100%) contrast(155%) brightness(106%);
      mix-blend-mode: multiply;
    }

    html[data-iframe-tone="dark"] .chat-tint-wrap {
      isolation: isolate;
      mix-blend-mode: screen;
    }

    html[data-iframe-tone="dark"] .chat-iframe {
      filter: grayscale(100%) contrast(155%) brightness(92%);
    }

    .chat-tint-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    html[data-iframe-tone="dark"] .chat-tint-overlay {
      display: block;
      background: #b9bcff;
      mix-blend-mode: multiply;
    }

    .chat-box-guides {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    .chat-panel[data-mode="box"] .chat-box-guides {
      display: block;
    }

    .box-mark {
      position: absolute;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
      opacity: 0.55;
      user-select: none;
    }

    .box-mark--tl { top: 0.55rem; left: 0.7rem; }
    .box-mark--tr { top: 0.55rem; right: 0.7rem; }
    .box-mark--bl { bottom: 0.55rem; left: 0.7rem; }
    .box-mark--br { bottom: 0.55rem; right: 0.7rem; }

    .chat-footer {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.9rem;
      border-top: var(--border-w) solid var(--ink);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      height: 2rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
      background: var(--bg);
    }

    /* Right Hero Bitmap Dithering Portrait / Video */
    .portrait-panel {
      position: relative;
      z-index: 3;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      isolation: isolate;
    }

    #portrait-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .portrait-video-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      overflow: hidden;
    }

    .portrait-video-fallback {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%) contrast(360%) brightness(112%);
      mix-blend-mode: multiply;
    }

    .portrait-video-tint {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    .portrait-embed-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      overflow: hidden;
      background: var(--bg);
    }

    .portrait-embed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000000;
      filter: grayscale(1) contrast(240%) brightness(108%);
      mix-blend-mode: multiply;
    }

    .portrait-embed-tint {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    .portrait-embed-dither {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle at 50% 50%, var(--ink) 0.7px, transparent 1.1px);
      background-size: 3px 3px;
      mix-blend-mode: multiply;
      opacity: 0.6;
    }

    html[data-theme="dark"] .portrait-embed {
      filter: grayscale(1) contrast(240%) brightness(92%);
      mix-blend-mode: normal;
    }

    html[data-theme="dark"] .portrait-embed-wrap {
      isolation: isolate;
      mix-blend-mode: screen;
    }

    html[data-theme="dark"] .portrait-embed-tint {
      display: block;
      background: #b9bcff;
      mix-blend-mode: multiply;
    }

    html[data-theme="dark"] .portrait-embed-dither {
      background-image: radial-gradient(circle at 50% 50%, var(--bg) 0.7px, transparent 1.1px);
    }

    html[data-media-embed="1"] #portrait-canvas,
    html[data-media-embed="1"] .portrait-video-wrap {
      display: none;
    }

    html[data-media-embed="1"] .portrait-embed-wrap {
      display: block;
    }

    html[data-media-embed="1"] .portrait-panel {
      align-items: center;
      justify-content: center;
    }

    html[data-video-fallback="1"] #portrait-canvas {
      display: none;
    }

    html[data-video-fallback="1"] .portrait-video-wrap {
      display: block;
    }

    html[data-video-fallback="1"][data-theme="dark"] .portrait-video-wrap {
      isolation: isolate;
      mix-blend-mode: screen;
    }

    html[data-video-fallback="1"][data-theme="dark"] .portrait-video-fallback {
      filter: grayscale(100%) contrast(360%) brightness(92%);
      mix-blend-mode: normal;
    }

    html[data-video-fallback="1"][data-theme="dark"] .portrait-video-tint {
      display: block;
      background: #b9bcff;
      mix-blend-mode: multiply;
    }

    /* Responsive Fallback for Portrait / Square OBS Canvases */
    @media (max-aspect-ratio: 5/4) {
      .scene {
        grid-template-columns: 5.5rem minmax(0, 1fr);
      }

      .portrait-panel {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 58%;
        height: 55%;
        opacity: 0.2;
        z-index: 1;
        pointer-events: none;
      }

      .stage {
        padding: 2.75rem 2rem;
      }

      .stage-body {
        grid-template-columns: minmax(0, 1fr);
      }

      .chat-panel {
        height: 18rem;
      }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="dither-trim dither-trim--top"></div>
    <div class="dither-trim dither-trim--bottom"></div>

    <!-- Left Editorial Rail -->
    <aside class="left-rail">
      <div class="rail-pills mono">
        <span class="v-pill" id="res-pill">1920X1080</span>
        <span class="v-pill">1-BIT</span>
        <span class="v-pill" id="media-pill">DITHER</span>
      </div>

      <div class="rail-stack">
        <span class="rail-text" id="rail-sub">ATKINSON_DITHERING</span>
        <span class="rail-text" id="rail-brand">BITMAP_CREATOR</span>
        <span class="rail-plus">+</span>
      </div>
    </aside>

    <!-- Center Workspace -->
    <main class="stage">
      <header class="top-bar">
        <div class="status-group">
          <span class="pixel-pulse" id="pulse-dot"></span>
          <span class="status-label mono" id="status-text">SIGNAL_STANDBY // INIT</span>
        </div>
        <div class="streamer-chip mono" id="streamer-chip">@BITMAP_STUDIO</div>
      </header>

      <div class="stage-body" id="stage-body">
        <div class="stage-main">
          <section class="hero-block">
            <div class="eyebrow mono">
              <span class="crosshair">+</span>
              <span id="eyebrow-text">SCENE_01 // BROADCAST_QUEUE</span>
            </div>

            <h1 class="headline" id="scene-title">STARTING</h1>

            <div class="timer-module">
              <div class="timer-meta mono">
                <span id="timer-caption">T-MINUS_COUNTDOWN</span>
                <span id="progress-pct">100%</span>
              </div>

              <div class="timer-row">
                <div class="timer-digits mono" id="timer-display">05:00</div>
                <div class="vu-wrap">
                  <span class="vu-label mono">SYNC_SIGNAL</span>
                  <canvas id="vu-canvas" width="48" height="16"></canvas>
                </div>
              </div>

              <div class="dither-bar-frame">
                <canvas id="dither-progress" width="240" height="8"></canvas>
              </div>
            </div>
          </section>

          <footer class="bottom-bar">
            <div class="pill-row mono" id="social-row"></div>
            <div class="coord-text mono" id="clock-text">SYNC // 60FPS</div>
          </footer>
        </div>

        <!-- Right Switchable Chat Slot (YouTube Iframe / OBS Box Chat) -->
        <aside class="chat-panel" id="chat-panel" data-mode="box">
          <div class="chat-header mono">
            <div class="chat-header-left">
              <span class="chat-dot"></span>
              <span id="chat-title">LIVE_CHAT // FEED</span>
            </div>
            <span class="chat-mode-tag" id="chat-mode-tag">OBS_BOX</span>
          </div>

          <div class="chat-body" id="chat-body">
            <div class="chat-tint-wrap">
              <iframe id="chat-iframe" class="chat-iframe" allow="autoplay"></iframe>
              <div class="chat-tint-overlay" aria-hidden="true"></div>
            </div>
            <div class="chat-box-guides mono" aria-hidden="true">
              <span class="box-mark box-mark--tl">+</span>
              <span class="box-mark box-mark--tr">+</span>
              <span class="box-mark box-mark--bl">+</span>
              <span class="box-mark box-mark--br">+</span>
            </div>
          </div>

          <div class="chat-footer mono">
            <span id="chat-foot-left">SLOT_READY</span>
            <span id="chat-foot-right">1-BIT_FRAME</span>
          </div>
        </aside>
      </div>
    </main>

    <!-- Right Hero 1-Bit Dithered Portrait / Video -->
    <section class="portrait-panel" aria-hidden="true">
      <canvas id="portrait-canvas" width="162" height="200"></canvas>
      <div class="portrait-video-wrap">
        <video id="portrait-video" class="portrait-video-fallback" muted loop playsinline autoplay></video>
        <div class="portrait-video-tint"></div>
      </div>
      <div class="portrait-embed-wrap">
        <iframe
          id="portrait-embed"
          class="portrait-embed"
          title="Media embed"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
        ></iframe>
        <div class="portrait-embed-tint"></div>
        <div class="portrait-embed-dither"></div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      const theme = (params.get("theme") || "light").toLowerCase();
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }

      if ((params.get("bg") || "").toLowerCase() === "transparent") {
        document.documentElement.setAttribute("data-bg", "transparent");
      }

      const chatBgParam = (params.get("chatBg") || "").toLowerCase();
      if (chatBgParam === "dark" || chatBgParam === "light") {
        document.documentElement.setAttribute("data-chat-bg", chatBgParam);
      }

      if (params.get("chatCrop") === "1") {
        document.documentElement.setAttribute("data-chat-crop", "1");
      }

      const titleParam = (params.get("title") || "STARTING").trim().toUpperCase();

        return [0, 0, 0];

      // 4x4 Ordered Bayer Matrix
      const BAYER4 = [

        [12,  4, 14,  6],
        [ 3, 11,  1,  9],

      function formatTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        const hrs = Math.floor(s / 3600);
        const mins = Math.floor((s % 3600) / 60);
        const remS = s % 60;
        const pad = function (n) { return n < 10 ? "0" + n : String(n); };
        return hrs > 0 ? pad(hrs) + ":" + pad(mins) + ":" + pad(remS) : pad(mins) + ":" + pad(remS);
      }

      function renderDitherProgress(ratio) {
        const w = progressCanvas.width;
        const h = progressCanvas.height;
        const ink = getInkRGB();
        const imgData = progressCtx.createImageData(w, h);
        const data = imgData.data;

        const clamped = Math.max(0, Math.min(1, ratio));
        const fillX = clamped * w;
        const feather = 28;

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            let density = 0;
            if (x < fillX - feather * 0.5) {
              density = 1;
            } else if (x > fillX + feather * 0.5) {
              density = 0;
            } else {
              density = 1 - (x - (fillX - feather * 0.5)) / feather;
            }

            const threshold = (BAYER4[y & 3][x & 3] + 0.5) / 16;
            if (density > threshold && clamped > 0) {
              data[idx] = ink[0];
              data[idx + 1] = ink[1];
              data[idx + 2] = ink[2];
              data[idx + 3] = 255;
            } else {
              data[idx + 3] = 0;
            }
          }
        }
        progressCtx.putImageData(imgData, 0, 0);
      }

        const pct = Math.round(ratio * 100);
        progressPct.textContent = (pct < 10 ? "0" + pct : pct) + "%";
        renderDitherProgress(totalSeconds > 0 ? ratio : 1);

        if (remaining <= 0) {
          statusText.textContent = "SIGNAL_LOCKED // LIVE_IMMINENT";
          timerCaption.textContent = "STREAM_STARTING_NOW";

      const vuHeights = new Array(vuBars).fill(4);

      function renderVU(tick) {
        const w = vuCanvas.width;
        const h = vuCanvas.height;
        const ink = getInkRGB();
        const imgData = vuCtx.createImageData(w, h);
        const data = imgData.data;

        for (let i = 0; i < vuBars; i++) {
          const wave = Math.sin(tick * 0.35 + i * 0.72) * 0.5 + 0.5;
          const wave2 = Math.cos(tick * 0.21 - i * 1.1) * 0.5 + 0.5;
          vuHeights[i] = Math.max(2, Math.round((wave * 0.65 + wave2 * 0.35) * (h - 2)));
        }

        for (let y = 0; y < h; y++) {
          const rowFromBottom = h - 1 - y;
          for (let i = 0; i < vuBars; i++) {
            const barH = vuHeights[i];
            const bx = i * 4;
            for (let dx = 0; dx < 3; dx++) {
              const x = bx + dx;
              if (x >= w) continue;
              const idx = (y * w + x) * 4;
              if (rowFromBottom < barH) {
                const isTip = rowFromBottom >= barH - 2;
                const ditherPass = !isTip || ((x + y) % 2 === 0);
                if (ditherPass) {
                  data[idx] = ink[0];
                  data[idx + 1] = ink[1];
                  data[idx + 2] = ink[2];
                  data[idx + 3] = 255;
                }
              }
            }
          }
        }
        vuCtx.putImageData(imgData, 0, 0);

      const portraitCanvas = document.getElementById("portrait-canvas");
      const pCtx = portraitCanvas.getContext("2d");
      pCtx.imageSmoothingEnabled = false;
      const PW = portraitCanvas.width;
      const PH = portraitCanvas.height;

      const bitMask = new Uint8Array(PW * PH);
      const grayBuf = new Float32Array(PW * PH);
      let sparseEdgeIndices = [];

      function buildEdgeCache() {
        sparseEdgeIndices = [];
        for (let y = 1; y < PH - 1; y++) {
          for (let x = 1; x < PW - 1; x++) {
            const i = y * PW + x;
            if (bitMask[i] === 1) {
              const neighbors =
                bitMask[i - 1] + bitMask[i + 1] + bitMask[i - PW] + bitMask[i + PW];
              if (neighbors <= 1) {
                sparseEdgeIndices.push(i);
              }
            }
          }
        }
      }

      function applyDitherFromRGBA(pixels) {
        if (ditherMode === "bayer") {
          for (let y = 0; y < PH; y++) {
            for (let x = 0; x < PW; x++) {
              const i = y * PW + x;
              const lum =
                0.299 * pixels[i * 4] +
                0.587 * pixels[i * 4 + 1] +
                0.114 * pixels[i * 4 + 2];
              const threshold = ((BAYER4[y & 3][x & 3] + 0.5) / 16) * 255;
              bitMask[i] = lum < threshold ? 1 : 0;
            }
          }
          return;
        }

        for (let i = 0; i < PW * PH; i++) {
          grayBuf[i] =
            0.299 * pixels[i * 4] +
            0.587 * pixels[i * 4 + 1] +
            0.114 * pixels[i * 4 + 2];
        }

        for (let y = 0; y < PH; y++) {
          for (let x = 0; x < PW; x++) {
            const i = y * PW + x;
            const oldVal = grayBuf[i];
            const newVal = oldVal < 128 ? 0 : 255;
            bitMask[i] = newVal === 0 ? 1 : 0;
            const err = (oldVal - newVal) / 8;

            if (x + 1 < PW) grayBuf[i + 1] += err;
            if (x + 2 < PW) grayBuf[i + 2] += err;
            if (y + 1 < PH) {
              if (x - 1 >= 0) grayBuf[i + PW - 1] += err;
              grayBuf[i + PW] += err;
              if (x + 1 < PW) grayBuf[i + PW + 1] += err;
            }
            if (y + 2 < PH) {
              grayBuf[i + PW * 2] += err;
            }
          }
        }
      }

      function renderPortraitFrame(revealRatio, shimmerTick, isVideo) {
        const ink = getInkRGB();
        const imgData = pCtx.createImageData(PW, PH);
        const data = imgData.data;

        for (let y = 0; y < PH; y++) {
          for (let x = 0; x < PW; x++) {
            const i = y * PW + x;
            if (bitMask[i] === 1) {
              if (revealRatio < 1) {
                const threshold = (BAYER4[y & 3][x & 3] + 0.5) / 16;
                if (revealRatio <= threshold) continue;
              }
              const idx = i * 4;
              data[idx] = ink[0];
              data[idx + 1] = ink[1];
              data[idx + 2] = ink[2];
              data[idx + 3] = 255;
            }
          }
        }

        if (!isVideo && revealRatio >= 1 && sparseEdgeIndices.length > 0) {
          const len = sparseEdgeIndices.length;
          for (let k = 0; k < 24; k++) {
            const pick = sparseEdgeIndices[(shimmerTick * 37 + k * 97) % len];
            const idx = pick * 4;
            data[idx + 3] = 0;
          }
        }

        pCtx.putImageData(imgData, 0, 0);
      }

      function startPortraitAnimation() {
        buildEdgeCache();
        const introStart = performance.now();
        const introDuration = 900;
        let lastShimmer = 0;
        let shimmerTick = 0;

        function loop(now) {
          const elapsed = now - introStart;
          if (elapsed < introDuration) {
            renderPortraitFrame(elapsed / introDuration, 0, false);
            requestAnimationFrame(loop);
          } else {
            if (now - lastShimmer > 180) {
              lastShimmer = now;
              shimmerTick++;
              renderPortraitFrame(1, shimmerTick, false);
            }
            requestAnimationFrame(loop);
          }
        }
        requestAnimationFrame(loop);
      }

      function loadEmbeddedBitmap() {
        document.getElementById("media-pill").textContent = "DITHER";
        const img = new Image();
        img.onload = function () {
          const off = document.createElement("canvas");
          off.width = PW;
          off.height = PH;
          const oCtx = off.getContext("2d");
          oCtx.imageSmoothingEnabled = false;
          oCtx.drawImage(img, 0, 0, PW, PH);
          const raw = oCtx.getImageData(0, 0, PW, PH).data;
          for (let i = 0; i < PW * PH; i++) {
            bitMask[i] = raw[i * 4 + 3] > 127 ? 1 : 0;
          }
          startPortraitAnimation();
        };
        img.src = EMBEDDED_PORTRAIT_B64;
      }

      function loadCustomImageDithered(url) {
        document.getElementById("media-pill").textContent = "IMAGE";
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function () {
          try {
            const off = document.createElement("canvas");
            off.width = PW;
            off.height = PH;
            const oCtx = off.getContext("2d");

            const scale = Math.max(PW / img.width, PH / img.height);
            const dw = img.width * scale;
            const dh = img.height * scale;
            const dx = (PW - dw) / 2;
            const dy = (PH - dh) / 2;

            oCtx.fillStyle = "#ffffff";
            oCtx.fillRect(0, 0, PW, PH);
            oCtx.drawImage(img, dx, dy, dw, dh);

            const pixels = oCtx.getImageData(0, 0, PW, PH).data;
            applyDitherFromRGBA(pixels);
            startPortraitAnimation();
          } catch (e) {
            loadEmbeddedBitmap();
          }
        };
        img.onerror = loadEmbeddedBitmap;
        img.src = url;
      }

      function loadVideoDithered(url) {
        document.getElementById("media-pill").textContent = "VIDEO";
        const isRemote = /^https?:\/\//i.test(url);
        let retriedWithoutCors = false;

        function startPlayback(useAnonymous) {
          const vid = document.getElementById("portrait-video");
          vid.muted = true;
          vid.loop = true;
          vid.playsInline = true;
          vid.autoplay = true;
          if (useAnonymous) {
            vid.crossOrigin = "anonymous";
          } else {
            vid.removeAttribute("crossOrigin");
          }

          const off = document.createElement("canvas");
          off.width = PW;
          off.height = PH;
          const oCtx = off.getContext("2d", { willReadFrequently: true });

          let running = false;
          let lastFrameTime = 0;
          const frameInterval = 1000 / videoFps;

          function ditherVideoFrame(now) {
            if (!running) return;
            requestAnimationFrame(ditherVideoFrame);
            if (now - lastFrameTime < frameInterval) return;
            if (vid.readyState < 2 || vid.videoWidth === 0) return;
            lastFrameTime = now;

            try {
              const vw = vid.videoWidth;
              const vh = vid.videoHeight;
              const scale = Math.max(PW / vw, PH / vh);
              const dw = vw * scale;
              const dh = vh * scale;
              const dx = (PW - dw) / 2;
              const dy = (PH - dh) / 2;

              oCtx.fillStyle = "#ffffff";
              oCtx.fillRect(0, 0, PW, PH);
              oCtx.drawImage(vid, dx, dy, dw, dh);

              const pixels = oCtx.getImageData(0, 0, PW, PH).data;
              applyDitherFromRGBA(pixels);
              renderPortraitFrame(1, 0, true);
            } catch (err) {
              running = false;
              document.documentElement.setAttribute("data-video-fallback", "1");
            }
          }

          vid.onloadeddata = function () {
            vid.play().catch(function () {});
            if (!running) {
              running = true;
              requestAnimationFrame(ditherVideoFrame);
            }
          };

          vid.onerror = function () {
            running = false;
            if (useAnonymous && !retriedWithoutCors) {
              retriedWithoutCors = true;
              startPlayback(false);
            } else {
              document.documentElement.removeAttribute("data-video-fallback");
              document.getElementById("media-pill").textContent = "DITHER";
              loadEmbeddedBitmap();
            }
          };

          vid.src = url;
          vid.load();
        }

        startPlayback(isRemote);
      }

      const YOUTUBE_RE = /(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i;

      function getYouTubeId(url) {
        const match = url.match(YOUTUBE_RE);
        return match ? match[1] : "";
      }

      function fitEmbedCover() {
        const wrap = document.querySelector(".portrait-embed-wrap");
        const embed = document.getElementById("portrait-embed");
        if (!wrap || !embed) return;
        const cw = wrap.clientWidth;
        const ch = wrap.clientHeight;
        if (!cw || !ch) return;
        const ratio = 16 / 9;
        let w = cw;
        let h = cw / ratio;
        if (h < ch) {
          h = ch;
          w = ch * ratio;
        }
        embed.style.width = w + "px";
        embed.style.height = h + "px";
        embed.style.left = (cw - w) / 2 + "px";
        embed.style.top = (ch - h) / 2 + "px";
      }

      window.addEventListener("resize", function () {
        requestAnimationFrame(fitEmbedCover);
      });

      if (window.ResizeObserver) {
        new ResizeObserver(fitEmbedCover).observe(
          document.querySelector(".portrait-embed-wrap")
        );
      }

      function loadYouTubeEmbed(videoId) {
        document.getElementById("media-pill").textContent = "EMBED";
        document.documentElement.setAttribute("data-media-embed", "1");
        const embed = document.getElementById("portrait-embed");
        embed.onload = fitEmbedCover;
        embed.src =
          "https://www.youtube.com/embed/" + videoId +
          "?autoplay=1&mute=1&loop=1&playlist=" + videoId +
          "&controls=0&modestbranding=1&rel=0&playsinline=1";
        fitEmbedCover();
        requestAnimationFrame(fitEmbedCover);
      }

      const isVideoExt = /\.(mp4|webm|ogg|mov)(\?.*)?$/i;
      const youTubeId = getYouTubeId(mediaParam) || getYouTubeId(videoParam);
      if (youTubeId) {
        loadYouTubeEmbed(youTubeId);
      } else if (videoParam) {
        loadVideoDithered(videoParam);
      } else if (mediaParam && isVideoExt.test(mediaParam)) {
        loadVideoDithered(mediaParam);
      } else if (mediaParam) {
        loadCustomImageDithered(mediaParam);
      } else {
        loadEmbeddedBitmap();
      }
    })();
  </script>
</body>
</html>
