<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #b9bcff;
      --ink: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0.35rem 0.45rem 0.5rem 0.35rem;
      background: transparent;
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", "Courier New", monospace;
    }

    img[src=""],
    img[src*="{"] {
      display: none !important;
    }

    @keyframes alert-enter {
      0% {
        opacity: 0;
        transform: translateY(0.75rem);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bit-blink {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .alert-card {
      position: relative;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      background: var(--bg);
      border: 0.125rem solid var(--ink);
      box-shadow: 0.3rem 0.3rem 0 0 var(--ink);
      animation: alert-enter 0.24s steps(5, end) forwards;
    }

    .dither-top {
      width: 100%;
      height: 0.4rem;
      background-image: conic-gradient(
        var(--ink) 90deg,
        transparent 90deg 180deg,
        var(--ink) 180deg 270deg,
        transparent 270deg
      );
      background-size: 0.4rem 0.4rem;
      border-bottom: 0.125rem solid var(--ink);
    }

    .alert-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.45rem 0.85rem;
      border-bottom: 0.125rem solid var(--ink);
      height: 2rem;
      flex-wrap: nowrap;
    }

    .head-left {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .head-dot {
      width: 0.55rem;
      height: 0.55rem;
      background: var(--ink);
      flex-shrink: 0;
      animation: bit-blink 1s steps(2, start) infinite;
    }

    .head-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .head-right {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .media-pill {
      display: none;
      border: 0.1rem solid var(--ink);
      border-radius: 999px;
      padding: 0.08rem 0.45rem;
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .alert-body {
      padding: 0.85rem 0.95rem 0.9rem 0.95rem;
    }

    .gifter-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: nowrap;
    }

    .avatar-box {
      position: relative;
      width: 3.1rem;
      height: 3.1rem;
      flex-shrink: 0;
      border: 0.125rem solid var(--ink);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar {
      width: 3.1rem;
      height: 3.1rem;
      object-fit: cover;
      display: none;
      filter: grayscale(100%) contrast(155%);
    }

    .avatar-fallback {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1;
    }

    .gifter-info {
      flex: 1;
      min-width: 0;
    }

    .name-line {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .gifter-name {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified-badge {
      display: none;
      background: var(--ink);
      color: var(--bg);
      border-radius: 999px;
      padding: 0.08rem 0.4rem;
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1.1;
      flex-shrink: 0;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.25rem;
    }

    .badge-icon {
      width: 1.05rem;
      height: 1.05rem;
      object-fit: contain;
      display: block;
      filter: grayscale(100%) contrast(155%);
    }

    .badge-tag {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: 0.1rem solid var(--ink);
      border-radius: 999px;
      padding: 0.06rem 0.45rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .amount-pill {
      flex-shrink: 0;
      background: var(--ink);
      color: var(--bg);
      border: 0.125rem solid var(--ink);
      border-radius: 999px;
      padding: 0.34rem 0.85rem;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .dither-divider-wrap {
      margin: 0.75rem 0 0.65rem 0;
    }

    #dither-divider {
      width: 100%;
      height: 0.45rem;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .message {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.38;
      word-break: break-word;
    }

    .alert-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.65rem;
      padding-top: 0.45rem;
      border-top: 0.1rem dashed var(--ink);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="alert-card">
    <div class="dither-top"></div>

    <div class="alert-head mono">
      <div class="head-left">
        <span class="head-dot"></span>
        <span class="head-label">TAKO_SUPPORT // 1-BIT</span>
      </div>
      <div class="head-right">
        <span class="media-pill" id="media-pill"></span>
        <span class="head-label">[+]</span>
      </div>
    </div>

    <div class="alert-body">
      <div class="gifter-row">
        <div class="avatar-box">
          <img class="avatar" id="avatar" width="50" height="50" alt="" />
          <span class="avatar-fallback mono" id="avatar-fallback">+</span>
        </div>

        <div class="gifter-info">
          <div class="name-line">
            <span class="gifter-name" id="gifter-name">{{gifterName}}</span>
            <span class="verified-badge mono" id="verified-badge">VERIFIED</span>
          </div>
          <div class="badges mono" id="badges"></div>
        </div>

        <div class="amount-pill mono" id="amount-pill">{{formattedAmount}}</div>
      </div>

      <div class="dither-divider-wrap" id="divider-wrap">
        <canvas id="dither-divider" width="220" height="6"></canvas>
      </div>

      <div class="message" id="message">{{message}}</div>

      <div class="alert-foot mono" id="alert-foot">
        <span>SIGNAL_RECEIVED</span>
        <span id="stamp">{{timestamp}}</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const picture = "{{gifterPicture}}".trim();
      const badgesRaw = "{{gifterBadges}}".trim();
      const isVerified = "{{isGifterVerified}}" === "true";
      const mediaDuration = "{{mediaDuration}}".trim();
      const showTimestamp = "{{showTimestamp}}" === "true";

      const BADGE_ICON_URLS = {
        "Tako Verified Partner": "https://tako.id/images/badges/partnered-creator.png",
        "Tako Verified Creator": "https://tako.id/images/badges/verified-creator.png",
        "Rich Rich Club": "https://tako.id/images/badges/king.png",
        "Charity": "https://tako.id/images/badges/charity.png",
        "VTuber": "https://tako.id/images/badges/vtuber.png",
        "Tako Team": "https://tako.id/images/badges/admin.png"
      };

      const avatar = document.getElementById("avatar");
      const avatarFallback = document.getElementById("avatar-fallback");
      const gifterNameEl = document.getElementById("gifter-name");
      const verifiedEl = document.getElementById("verified-badge");
      const badgesEl = document.getElementById("badges");
      const messageEl = document.getElementById("message");
      const dividerWrap = document.getElementById("divider-wrap");
      const mediaPill = document.getElementById("media-pill");
      const footEl = document.getElementById("alert-foot");
      const stampEl = document.getElementById("stamp");

      if (!gifterNameEl.textContent.trim() || gifterNameEl.textContent.indexOf("{{") !== -1) {
        gifterNameEl.textContent = "SUPPORTER";
      }

      if (picture && picture.indexOf("{{") === -1) {
        avatar.src = picture;
        avatar.style.display = "block";
        avatarFallback.style.display = "none";
        avatar.onerror = function () {
          avatar.style.display = "none";
          avatarFallback.style.display = "block";
        };
      }

      if (isVerified) {
        verifiedEl.style.display = "inline-block";
      }

      if (badgesRaw && badgesRaw.indexOf("{{") === -1) {
        badgesRaw.split(",").forEach(function (rawItem) {
          const entry = rawItem.trim();
          if (!entry) return;

          const isUrl =
            entry.indexOf("https://") === 0 ||
            entry.indexOf("http://") === 0 ||
            entry.indexOf("/") === 0;

          const iconUrl = isUrl ? entry : BADGE_ICON_URLS[entry];

          if (iconUrl) {
            const icon = document.createElement("img");
            icon.className = "badge-icon";
            icon.width = 17;
            icon.height = 17;
            icon.src = iconUrl;
            icon.alt = isUrl ? "Badge" : entry;
            icon.title = isUrl ? "" : entry;
            icon.onerror = function () {
              icon.remove();
              if (!isUrl) {
                const fallbackTag = document.createElement("span");
                fallbackTag.className = "badge-tag";
                fallbackTag.textContent = entry;
                badgesEl.appendChild(fallbackTag);
              }
            };
            badgesEl.appendChild(icon);
          } else {
            const tag = document.createElement("span");
            tag.className = "badge-tag";
            tag.textContent = entry;
            badgesEl.appendChild(tag);
          }
        });
      }

      if (badgesEl.children.length === 0) {
        badgesEl.style.display = "none";
      }

      const msgText = messageEl.textContent.trim();
      const hasMessage = msgText.length > 0 && msgText.indexOf("{{") === -1;
      if (!hasMessage) {
        messageEl.style.display = "none";
      }

      if (mediaDuration && mediaDuration.indexOf("{{") === -1 && Number(mediaDuration) > 0) {
        mediaPill.textContent = mediaDuration + "S";
        mediaPill.style.display = "inline-block";
      }

      const stampText = stampEl.textContent.trim();
      if (!showTimestamp || !stampText || stampText.indexOf("{{") !== -1) {
        footEl.style.display = "none";
      }

      if (!hasMessage && footEl.style.display === "none") {
        dividerWrap.style.display = "none";
      } else {
        const dCanvas = document.getElementById("dither-divider");
        const dCtx = dCanvas.getContext("2d");
        dCtx.imageSmoothingEnabled = false;
        const w = dCanvas.width;
        const h = dCanvas.height;
        const cs = getComputedStyle(document.documentElement);
        const inkHex = cs.getPropertyValue("--ink").trim();
        let ir = 0;
        let ig = 0;
        let ib = 0;
        if (inkHex.indexOf("#") === 0 && inkHex.length === 7) {
          ir = parseInt(inkHex.slice(1, 3), 16);
          ig = parseInt(inkHex.slice(3, 5), 16);
          ib = parseInt(inkHex.slice(5, 7), 16);
        }
        const BAYER4 = [
          [0, 8, 2, 10],
          [12, 4, 14, 6],
          [3, 11, 1, 9],
          [15, 7, 13, 5]
        ];
        const imgData = dCtx.createImageData(w, h);
        const data = imgData.data;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const density = 1 - (x / w) * 0.92;
            const threshold = (BAYER4[y & 3][x & 3] + 0.5) / 16;
            if (density > threshold) {
              const idx = (y * w + x) * 4;
              data[idx] = ir;
              data[idx + 1] = ig;
              data[idx + 2] = ib;
              data[idx + 3] = 255;
            }
          }
        }
        dCtx.putImageData(imgData, 0, 0);
      }
    })();
  </script>
</body>
</html>
