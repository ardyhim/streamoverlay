<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARTING LIVE // LIVE STREAM</title>
  <style>
    :root {
      --cream: #FBF7EE;
      --turquoise: #00B5A3;
      --coral: #FF5E7E;
      --yellow: #FFE033;
      --cobalt: #2B4EFF;
      --black: #141414;
      --mint: #B5F2E6;

      --wall-bg: var(--cream);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font-display: "Futura", "Century Gothic", "Twentieth Century", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--wall-bg);
      color: var(--black);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    /* Full-viewport studio wall backdrop */
    #studio-wall {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      transition: background-color 0.45s var(--spring);
    }

    #studio-wall svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Main scalable exhibition stage */
    #stage-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    #memphis-stage {
      width: 100%;
      height: 100%;
      max-width: 1600px;
      max-height: 980px;
      overflow: visible;
    }

    /* Kinetic SVG group transitions */
    .kinetic {
      transition:
        transform 0.72s var(--spring),
        opacity 0.35s ease;
      transform-box: fill-box;
      transform-origin: center center;
      cursor: pointer;
    }

    .kinetic-slow {
      transition: transform 0.85s var(--spring);
      transform-box: fill-box;
      transform-origin: center center;
      cursor: pointer;
    }

    /* Hover micro-interactions on sculptural objects */
    .totem-hover:hover .totem-inner {
      transform: scale(1.07) rotate(-4deg);
    }

    .totem-inner {
      transition: transform 0.38s var(--spring);
      transform-box: fill-box;
      transform-origin: center center;
    }

    .social-totem:hover .social-flip {
      transform: scale(1.12) rotate(8deg) translateY(-6px);
    }

    .social-flip {
      transition: transform 0.45s var(--spring);
      transform-box: fill-box;
      transform-origin: center center;
    }

    .social-totem.is-flipping .social-flip {
      animation: badgeFlip3D 0.75s var(--spring);
    }

    @keyframes badgeFlip3D {
      0% { transform: scale(1) rotateY(0deg) rotate(0deg); }
      45% { transform: scale(1.16) rotateY(180deg) rotate(-6deg); }
      100% { transform: scale(1) rotateY(360deg) rotate(0deg); }
    }

    /* Train hover whistle animation */
    #train-group {
      cursor: pointer;
    }

    .steam-puff {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    #train-group:hover .steam-puff,
    #train-group.whistling .steam-puff {
      animation: puffRise 0.85s ease-out infinite;
    }

    #train-group:hover .steam-puff.p2,
    #train-group.whistling .steam-puff.p2 {
      animation-delay: 0.22s;
    }

    #train-group:hover .steam-puff.p3,
    #train-group.whistling .steam-puff.p3 {
      animation-delay: 0.44s;
    }

    @keyframes puffRise {
      0% { opacity: 0.95; transform: translate(0, 0) scale(0.5) rotate(0deg); }
      60% { opacity: 0.9; transform: translate(-18px, -28px) scale(1.15) rotate(25deg); }
      100% { opacity: 0; transform: translate(-34px, -54px) scale(1.45) rotate(55deg); }
    }

    /* Numeral tumble pulse on minute / shuffle */
    .numeral-card {
      transition: transform 0.78s var(--spring);
      transform-box: fill-box;
      transform-origin: center center;
    }

    .numeral-card.tumbling {
      animation: numeralTumble 0.82s var(--spring);
    }

    @keyframes numeralTumble {
      0% { transform: rotate(0deg) scale(1); }
      38% { transform: rotate(180deg) scale(0.84); }
      72% { transform: rotate(370deg) scale(1.06); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Plaques */
    .plaque {
      background: var(--cream);
      border: 4px solid var(--black);
      box-shadow: 6px 6px 0 var(--black);
      color: var(--black);
      font-family: var(--font-display);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Top-Left Stream Header Plaque */
    #header-plaque {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      background: var(--cream);
      max-width: 320px;
    }

    .plaque-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plaque-badge {
      background: var(--yellow);
      border: 3px solid var(--black);
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.2;
    }

    .plaque-badge.coral {
      background: var(--coral);
      color: var(--cream);
    }

    .plaque-title {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 0.1em;
    }

    .plaque-sub {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Top-Right Live Status Plaque */
    #status-plaque {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--mint);
    }

    #status-plaque.is-demo {
      background: var(--yellow);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid var(--black);
      background: var(--coral);
      flex-shrink: 0;
      animation: livePulse 1.1s ease-in-out infinite;
    }

    @keyframes livePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.65; }
    }

    #status-plaque.is-demo .status-dot {
      background: var(--cobalt);
      animation: demoBlink 0.6s steps(2, start) infinite;
    }

    @keyframes demoBlink {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.55; }
    }

    .status-text {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      line-height: 1.2;
    }

    /* Bottom-Left Stream Status Legend Plaque */
    #legend-plaque {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 20;
      padding: 8px 12px;
      background: var(--yellow);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .legend-chip {
      background: var(--black);
      color: var(--cream);
      padding: 2px 6px;
      font-size: 9px;
    }

    /* Responsive adjustments for smaller screens */
    @media (max-width: 860px) {
      #header-plaque {
        top: 8px;
        left: 8px;
        padding: 7px 10px;
        border-width: 3px;
        box-shadow: 4px 4px 0 var(--black);
      }
      .plaque-title { font-size: 12px; }
      #status-plaque {
        top: 8px;
        right: 8px;
        padding: 6px 9px;
        border-width: 3px;
        box-shadow: 4px 4px 0 var(--black);
      }
      #legend-plaque {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .kinetic,
      .kinetic-slow,
      .totem-inner,
      .social-flip,
      .numeral-card,
      .status-dot {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- STUDIO WALL PATTERN BACKDROP -->
  <div id="studio-wall" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>

          <path d="M35,120 C52,102 72,118 62,138 C52,158 82,162 96,142" fill="none" stroke="#FF5E7E" stroke-width="4" stroke-linecap="round" opacity="0.32"/>

          <polygon points="48,74 68,82 54,102 36,92" fill="#2B4EFF" stroke="#141414" stroke-width="2" opacity="0.28"/>

        <pattern id="wall-casablanca" width="120" height="120" patternUnits="userSpaceOnUse">

          </g>
        </pattern>
      </defs>
      <rect id="wall-rect" width="1440" height="900" fill="url(#wall-bacterio)" />
    </svg>
  </div>

  <!-- TOP-LEFT STREAMING HEADER PLAQUE -->
  <header id="header-plaque" class="plaque">
    <div class="plaque-top-row">
      <span class="plaque-badge">LIVE STREAM</span>
      <span class="plaque-badge coral">STARTING LIVE</span>
    </div>
    <div class="plaque-title">STARTING SOON // ON AIR</div>
    <div class="plaque-sub">
      <span>LIVE BROADCAST</span>
      <span>•</span>
      <span id="active-pattern-label">BACTERIO</span>
    </div>
  </header>

  <!-- TOP-RIGHT STREAM STATUS PLAQUE -->
  <div id="status-plaque" class="plaque">
    <span class="status-dot"></span>
    <div class="status-text">
      <div id="status-mode-title">LIVE TIME // STANDBY</div>
      <div id="status-mode-sub">BROADCAST SYNC READY</div>
    </div>
  </div>

  <!-- BOTTOM-LEFT STREAM STATUS LEGEND PLAQUE -->
  <div id="legend-plaque" class="plaque">
    <span class="legend-chip">ON AIR</span>
    <span>STARTING LIVE / STANDBY / CHAT OPEN</span>
    <span>•</span>
    <span>SOCIAL CLUB 1981</span>
  </div>

  <!-- MASTER SCULPTURAL STAGE -->
  <main id="stage-wrap">
    <svg id="memphis-stage" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Starting Live Stream Clock">
      <defs>
        <!-- Reusable Laminate Patterns -->
        <pattern id="pat-stripes-bw" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="16" height="16" fill="#FBF7EE"/>
          <rect width="8" height="16" fill="#141414"/>
        </pattern>

        <pattern id="pat-stripes-mint" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
          <rect width="16" height="16" fill="#B5F2E6"/>
          <rect width="7" height="16" fill="#00B5A3"/>
        </pattern>

        <pattern id="pat-stripes-coral" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="14" height="14" fill="#FFE033"/>
          <rect width="6" height="14" fill="#FF5E7E"/>
        </pattern>

        <!-- Polka Dots -->
        <pattern id="pat-dots-yellow" width="20" height="20" patternUnits="userSpaceOnUse">
          <rect width="20" height="20" fill="#FFE033"/>
          <circle cx="10" cy="10" r="4" fill="#141414"/>
        </pattern>

        <pattern id="pat-dots-mint" width="22" height="22" patternUnits="userSpaceOnUse">
          <rect width="22" height="22" fill="#B5F2E6"/>
          <circle cx="6" cy="6" r="3.2" fill="#FF5E7E"/>
          <circle cx="17" cy="17" r="3.2" fill="#2B4EFF"/>
        </pattern>

        <!-- Checkerboard Cobalt -->
        <pattern id="pat-checker-cobalt" width="28" height="28" patternUnits="userSpaceOnUse">
          <rect width="28" height="28" fill="#FBF7EE"/>
          <rect x="0" y="0" width="14" height="14" fill="#2B4EFF"/>
          <rect x="14" y="14" width="14" height="14" fill="#2B4EFF"/>
        </pattern>

        <!-- Checkerboard Black/Cream -->
        <pattern id="pat-checker-bw" width="20" height="20" patternUnits="userSpaceOnUse">
          <rect width="20" height="20" fill="#FBF7EE"/>
          <rect x="0" y="0" width="10" height="10" fill="#141414"/>
          <rect x="10" y="10" width="10" height="10" fill="#141414"/>
        </pattern>

        <!-- BACTERIO -->
        <pattern id="pat-theme-bacterio-a" width="60" height="60" patternUnits="userSpaceOnUse">
          <rect width="60" height="60" fill="#B5F2E6"/>
          <path d="M8,16 C18,6 28,22 22,32 C16,42 30,48 38,38" fill="none" stroke="#141414" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M36,12 C48,8 54,24 44,30" fill="none" stroke="#FF5E7E" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="14" cy="48" r="3.5" fill="#FFE033" stroke="#141414" stroke-width="1.8"/>
          <circle cx="48" cy="48" r="3" fill="#141414"/>
        </pattern>

        <pattern id="pat-theme-bacterio-b" width="56" height="56" patternUnits="userSpaceOnUse">
          <rect width="56" height="56" fill="#FBF7EE"/>
          <path d="M10,14 C22,22 14,36 28,42" fill="none" stroke="#00B5A3" stroke-width="3.8" stroke-linecap="round"/>
          <path d="M34,10 C46,16 38,30 48,40" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
          <circle cx="44" cy="14" r="3" fill="#FF5E7E"/>
          <circle cx="14" cy="44" r="3" fill="#2B4EFF"/>
        </pattern>

        <!-- TERRAZZO -->
        <pattern id="pat-theme-terrazzo-a" width="64" height="64" patternUnits="userSpaceOnUse">
          <rect width="64" height="64" fill="#FBF7EE"/>
          <polygon points="8,10 22,14 14,26" fill="#FF5E7E" stroke="#141414" stroke-width="1.8"/>
          <polygon points="36,8 52,16 42,28 32,20" fill="#00B5A3" stroke="#141414" stroke-width="1.8"/>
          <polygon points="16,38 30,44 22,56 10,48" fill="#FFE033" stroke="#141414" stroke-width="1.8"/>
          <polygon points="44,38 58,44 50,58 38,50" fill="#2B4EFF" stroke="#141414" stroke-width="1.8"/>
          <circle cx="30" cy="30" r="2.5" fill="#141414"/>
        </pattern>

        <pattern id="pat-theme-terrazzo-b" width="58" height="58" patternUnits="userSpaceOnUse">
          <rect width="58" height="58" fill="#B5F2E6"/>
          <polygon points="10,12 24,8 20,24" fill="#FFE033" stroke="#141414" stroke-width="1.8"/>
          <polygon points="34,14 50,22 38,32" fill="#FF5E7E" stroke="#141414" stroke-width="1.8"/>
          <polygon points="12,38 28,36 22,52" fill="#2B4EFF" stroke="#141414" stroke-width="1.8"/>
          <polygon points="38,40 52,44 46,54" fill="#FBF7EE" stroke="#141414" stroke-width="1.8"/>
        </pattern>

        <!-- CASABLANCA -->
        <pattern id="pat-theme-casablanca-a" width="40" height="40" patternUnits="userSpaceOnUse">
          <rect width="40" height="40" fill="#FBF7EE"/>
          <rect x="0" y="0" width="20" height="20" fill="#141414"/>
          <rect x="20" y="20" width="20" height="20" fill="#141414"/>
          <circle cx="30" cy="10" r="4" fill="#FFE033"/>
          <circle cx="10" cy="30" r="4" fill="#2B4EFF"/>
        </pattern>

        <pattern id="pat-theme-casablanca-b" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="32" height="32" fill="#FFE033"/>
          <rect x="0" y="0" width="12" height="32" fill="#2B4EFF"/>
          <rect x="12" y="0" width="4" height="32" fill="#141414"/>
        </pattern>

        <!-- Dial clip path -->
        <clipPath id="clip-cobalt-dial">
          <circle cx="0" cy="0" r="142"/>
        </clipPath>
      </defs>

      <!-- ================================================================ -->
      <!-- LAYER 1: BACKGROUND ARCHITECTURAL TOTEMS & STEPPED ARCHES         -->
      <!-- ================================================================ -->

        <!-- Left Stepped Arch Totem -->
        <g id="arch-left" class="kinetic totem-hover" data-shuffle-target="archLeft">

        </g>

        <!-- Right Asymmetric Stepped Slab & Pillar -->
        <g id="arch-right" class="kinetic totem-hover" data-shuffle-target="archRight">
          <g class="totem-inner">
            <rect x="1055" y="210" width="165" height="285" fill="#141414" transform="translate(10,10)"/>
            <rect class="theme-fill-b" x="1055" y="210" width="165" height="285" fill="url(#pat-theme-bacterio-b)" stroke="#141414" stroke-width="5"/>
            <rect x="1025" y="255" width="90" height="90" fill="#FF5E7E" stroke="#141414" stroke-width="4.5"/>
            <circle cx="1070" cy="300" r="22" fill="#FFE033" stroke="#141414" stroke-width="4"/>
            <rect x="1115" y="385" width="128" height="48" fill="#2B4EFF" stroke="#141414" stroke-width="4.5"/>
            <rect x="1125" y="395" width="108" height="28" fill="url(#pat-stripes-bw)" stroke="#141414" stroke-width="3"/>
            <!-- Label -->
            <rect x="1068" y="446" width="138" height="24" fill="#141414"/>
            <text x="1137" y="462" text-anchor="middle" font-size="10.5" font-weight="900" letter-spacing="1.6" fill="#FFE033">LIVE STREAM</text>
          </g>
        </g>

        <!-- Rotating Cobalt Checkerboard Dial -->
        <g id="cobalt-dial-anchor" transform="translate(720, 355)">
          <g id="cobalt-dial-rotator">
            <circle cx="10" cy="10" r="154" fill="#141414"/>
            <circle cx="0" cy="0" r="154" fill="#FFE033" stroke="#141414" stroke-width="5"/>
            <g clip-path="url(#clip-cobalt-dial)">
              <rect x="-150" y="-150" width="300" height="300" fill="url(#pat-checker-cobalt)"/>
              <rect x="-150" y="-12" width="300" height="24" fill="#FF5E7E" stroke="#141414" stroke-width="4"/>
              <rect x="-12" y="-150" width="24" height="300" fill="#00B5A3" stroke="#141414" stroke-width="4"/>
            </g>
            <circle cx="0" cy="0" r="142" fill="none" stroke="#141414" stroke-width="5"/>
            <g id="dial-teeth">
              <rect x="-8" y="-166" width="16" height="20" fill="#FF5E7E" stroke="#141414" stroke-width="3.5"/>
              <rect x="-8" y="146" width="16" height="20" fill="#FF5E7E" stroke="#141414" stroke-width="3.5"/>
              <rect x="-166" y="-8" width="20" height="16" fill="#00B5A3" stroke="#141414" stroke-width="3.5"/>
              <rect x="146" y="-8" width="20" height="16" fill="#00B5A3" stroke="#141414" stroke-width="3.5"/>
            </g>
          </g>

        <g id="totem-social-yt" class="kinetic social-totem" data-shuffle-target="socialYt" data-social="youtube" transform="translate(330, 145)">
          <g class="social-flip">
            <polygon points="0,-54 58,0 0,54 -58,0" fill="#00B5A3" stroke="#141414" stroke-width="4.5" transform="translate(5,5)"/>
            <polygon points="0,-54 58,0 0,54 -58,0" fill="#FFE033" stroke="#141414" stroke-width="4.5"/>
            <rect x="-30" y="-21" width="60" height="42" rx="11" fill="#FF5E7E" stroke="#141414" stroke-width="4"/>
            <polygon points="-7,-10 13,0 -7,10" fill="#FBF7EE" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/>
            <rect x="-46" y="42" width="92" height="19" fill="#141414"/>
            <text x="0" y="55" text-anchor="middle" font-size="8.8" font-weight="900" letter-spacing="1.2" fill="#B5F2E6">LIVE CHANNELS</text>
          </g>
        </g>

        <!-- Totem 4: TWITCH -->
        <g id="totem-social-tw" class="kinetic social-totem" data-shuffle-target="socialTw" data-social="twitch" transform="translate(1285, 435)">
          <g class="social-flip">
            <rect x="-46" y="42" width="92" height="20" fill="#00B5A3" stroke="#141414" stroke-width="4"/>
            <rect x="-30" y="24" width="60" height="18" fill="#FF5E7E" stroke="#141414" stroke-width="4"/>
            <circle cx="5" cy="-16" r="42" fill="#141414"/>
            <circle cx="0" cy="-20" r="42" fill="#2B4EFF" stroke="#141414" stroke-width="4.5"/>
            <circle cx="0" cy="-20" r="33" fill="#B5F2E6" stroke="#141414" stroke-width="3"/>
            <path d="M -18 -40 L -22 -30 L -22 -2 L -10 -2 L -10 5 L -2 -2 L 8 -2 L 20 -14 L 20 -40 Z"
                  fill="#2B4EFF" stroke="#141414" stroke-width="3.2" stroke-linejoin="round"/>
            <rect x="-4" y="-31" width="5" height="12" fill="#FBF7EE"/>
            <rect x="7" y="-31" width="5" height="12" fill="#FBF7EE"/>
            <rect x="-66" y="64" width="132" height="20" fill="#FBF7EE" stroke="#141414" stroke-width="3"/>
            <text x="0" y="78" text-anchor="middle" font-size="8.6" font-weight="900" letter-spacing="1.1" fill="#141414">CHAT STANDING BY</text>
          </g>
        </g>

      </g>
    </svg>
  </main>

  <script>
    (() => {
      "use strict";

      /* --------------------------------------------------------------------
         1. ARCHITECTURAL SVG DIGIT GLYPHS (0-9)
         -------------------------------------------------------------------- */
      const DIGIT_PATHS = {
        "0": "M 8 0 H 56 L 64 8 V 80 L 56 88 H 8 L 0 80 V 8 Z M 20 20 V 68 H 44 V 20 Z",
        "1": "M 16 14 L 32 0 H 48 V 70 H 62 V 88 H 6 V 70 H 26 V 24 L 16 30 Z",
        "2": "M 4 16 L 16 0 H 52 L 64 14 V 38 L 28 68 H 64 V 88 H 2 V 68 L 42 32 V 20 H 20 V 30 H 4 Z",
        "3": "M 4 0 H 54 L 64 12 V 34 L 52 44 L 64 54 V 76 L 54 88 H 4 V 68 H 42 V 54 H 20 V 36 H 42 V 20 H 4 Z",
        "4": "M 4 0 H 24 V 38 H 42 V 0 H 62 V 88 H 42 V 56 H 4 Z",
        "5": "M 4 0 H 62 V 20 H 24 V 34 H 52 L 64 46 V 76 L 52 88 H 4 V 68 H 42 V 52 H 4 Z",
        "6": "M 12 0 H 58 V 20 H 22 V 34 H 54 L 64 44 V 76 L 52 88 H 12 L 0 76 V 12 Z M 22 52 V 68 H 44 V 52 Z",
        "7": "M 2 0 H 64 V 20 L 34 88 H 12 L 40 20 H 2 Z",
        "8": "M 12 0 H 52 L 62 12 V 34 L 52 44 L 62 54 V 76 L 52 88 H 12 L 2 76 V 54 L 12 44 L 2 34 V 12 Z M 22 18 V 34 H 42 V 18 Z M 22 54 V 70 H 42 V 54 Z",
        "9": "M 12 0 H 52 L 64 12 V 76 L 52 88 H 8 V 68 H 44 V 52 H 12 L 2 42 V 12 Z M 22 18 V 34 H 44 V 18 Z"
      };

      const digitNodes = {
        h1: document.getElementById("digit-h1"),
        h2: document.getElementById("digit-h2"),
        m1: document.getElementById("digit-m1"),
        m2: document.getElementById("digit-m2")
      };

      const currentDigits = { h1: "", h2: "", m1: "", m2: "" };

      function renderDigit(key, char, fillColor = "#141414") {
        if (currentDigits[key] === char) return;
        currentDigits[key] = char;
        const container = digitNodes[key];
        const pathData = DIGIT_PATHS[char] || DIGIT_PATHS["0"];
        container.innerHTML = `
          <path d="${pathData}" fill="#141414" transform="translate(4,4)" fill-rule="evenodd"/>
          <path d="${pathData}" fill="${fillColor}" stroke="#141414" stroke-width="3.5" stroke-linejoin="round" fill-rule="evenodd"/>
        `;
      }

      /* --------------------------------------------------------------------
         2. THEME ENGINE (BACTERIO / TERRAZZO / CASABLANCA)
            Optional URL param support: ?theme=casablanca or ?theme=terrazzo
         -------------------------------------------------------------------- */
      const THEMES = {
        bacterio: {
          label: "BACTERIO",
          wall: "url(#wall-bacterio)",
          fillA: "url(#pat-theme-bacterio-a)",
          fillB: "url(#pat-theme-bacterio-b)",
          wallBg: "#FBF7EE"
        },
        terrazzo: {
          label: "TERRAZZO",
          wall: "url(#wall-terrazzo)",
          fillA: "url(#pat-theme-terrazzo-a)",
          fillB: "url(#pat-theme-terrazzo-b)",
          wallBg: "#FBF7EE"
        },
        casablanca: {
          label: "CASABLANCA",
          wall: "url(#wall-casablanca)",
          fillA: "url(#pat-theme-casablanca-a)",
          fillB: "url(#pat-theme-casablanca-b)",
          wallBg: "#FBF7EE"
        }
      };

      function applyTheme(themeKey) {
        if (!THEMES[themeKey]) return;
        const t = THEMES[themeKey];

        document.getElementById("wall-rect").setAttribute("fill", t.wall);
        document.documentElement.style.setProperty("--wall-bg", t.wallBg);

        document.querySelectorAll(".theme-fill-a").forEach(el => el.setAttribute("fill", t.fillA));
        document.querySelectorAll(".theme-fill-b").forEach(el => el.setAttribute("fill", t.fillB));

        const activeLabel = document.getElementById("active-pattern-label");
        if (activeLabel) activeLabel.textContent = t.label;
      }

      /* --------------------------------------------------------------------
         3. CURVED RAILWAY SLEEPERS & AUTONOMOUS HYPE TRAIN MOTION
         -------------------------------------------------------------------- */
      const trackPath = document.getElementById("train-track-path");
      const trackLength = trackPath.getTotalLength();
      const sleepersGroup = document.getElementById("track-sleepers");
      const sleeperColors = ["#FFE033", "#FF5E7E", "#00B5A3", "#2B4EFF"];

      function buildTrackSleepers() {
        const count = 42;
        let html = "";
        for (let i = 0; i <= count; i++) {
          const dist = (i / count) * trackLength;
          const pt = trackPath.getPointAtLength(dist);
          const pt2 = trackPath.getPointAtLength(Math.min(trackLength, dist + 2));
          const angle = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * (180 / Math.PI);
          const color = sleeperColors[i % sleeperColors.length];
          html += `<rect x="-5" y="-14" width="10" height="28" rx="2" fill="${color}" stroke="#141414" stroke-width="2.5" transform="translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)}) rotate(${angle.toFixed(1)})"/>`;
        }
        sleepersGroup.innerHTML = html;
      }
      buildTrackSleepers();

      const trainLoco = document.getElementById("train-loco");
      const trainCar1 = document.getElementById("train-car-1");
      const trainCar2 = document.getElementById("train-car-2");
      const wheelEls = Array.from(document.querySelectorAll(".train-wheel"));

      const trainState = {
        progress: 0.42,
        targetProgress: 0.42,
        velocity: 0.022,
        direction: 1,
        boostTimer: 0,
        wheelAngle: 0,
        lastFrame: performance.now()
      };

      function placeVehicle(el, dist, bobOffset) {
        const clamped = Math.max(0, Math.min(trackLength, dist));
        const p1 = trackPath.getPointAtLength(clamped);
        const p2 = trackPath.getPointAtLength(Math.min(trackLength, clamped + 4));
        const p0 = trackPath.getPointAtLength(Math.max(0, clamped - 4));
        const angle = Math.atan2(p2.y - p0.y, p2.x - p0.x) * (180 / Math.PI);
        el.setAttribute("transform", `translate(${p1.x.toFixed(2)}, ${(p1.y - 6).toFixed(2)}) rotate(${angle.toFixed(2)})`);
        const bounceEl = el.querySelector(".car-bounce");
        if (bounceEl) {
          bounceEl.setAttribute("transform", `translate(0, ${bobOffset.toFixed(2)})`);
        }
      }

      function animateTrain(now) {
        const dt = Math.min(0.05, (now - trainState.lastFrame) / 1000);
        trainState.lastFrame = now;

        if (trainState.boostTimer > 0) {
          trainState.boostTimer -= dt;
          const diff = trainState.targetProgress - trainState.progress;
          trainState.progress += diff * Math.min(1, dt * 3.4);
          trainState.wheelAngle += Math.abs(diff) * 2800 * dt + 240 * dt;
        } else {
          const cruiseSpeed = 0.024 * trainState.direction;
          trainState.progress += cruiseSpeed * dt;
          if (trainState.progress > 0.87) {
            trainState.progress = 0.87;
            trainState.direction = -1;
          } else if (trainState.progress < 0.24) {
            trainState.progress = 0.24;
            trainState.direction = 1;
          }
          trainState.wheelAngle += 140 * dt * trainState.direction;
        }

        const locoDist = trainState.progress * trackLength;
        const car1Dist = locoDist - 122;
        const car2Dist = locoDist - 234;

        const tSec = now * 0.008;
        placeVehicle(trainLoco, locoDist, Math.sin(tSec) * 1.8);
        placeVehicle(trainCar1, car1Dist, Math.sin(tSec - 0.9) * 1.6);
        placeVehicle(trainCar2, car2Dist, Math.sin(tSec - 1.8) * 1.6);

        wheelEls.forEach(w => {
          const baseTf = w.getAttribute("transform").split(" rotate")[0];
          w.setAttribute("transform", `${baseTf} rotate(${(trainState.wheelAngle % 360).toFixed(1)})`);
        });

        requestAnimationFrame(animateTrain);
      }

      const trainGroup = document.getElementById("train-group");
      trainGroup.addEventListener("click", (e) => {
        e.stopPropagation();
        triggerShuffle();
      });

      /* --------------------------------------------------------------------
         4. CENTRALIZED SHUFFLE ENGINE
         -------------------------------------------------------------------- */
      let shuffleIndex = 0;

      const SHUFFLE_PALETTES = {
        pediment: [
          "translate(0, 0) rotate(0deg)",
          "translate(-16, -6) rotate(-2deg)",
          "translate(18, -4) rotate(2deg)",
          "translate(0, -10) rotate(0deg) scale(1.03)"
        ],
        archLeft: [
          "translate(0, 0) rotate(0deg)",
          "translate(-22, -26) rotate(-6deg)",
          "translate(16, 14) rotate(8deg)",
          "translate(-12, 22) rotate(180deg)"
        ],
        archRight: [
          "translate(0, 0) rotate(0deg)",
          "translate(22, -24) rotate(6deg)",
          "translate(-14, 18) rotate(-8deg)",
          "translate(14, -10) rotate(180deg)"
        ],
        tile1: [
          "translate(0, 0) rotate(0deg)",
          "translate(-44, -18) rotate(90deg)",
          "translate(28, -22) rotate(180deg)",
          "translate(-18, 22) rotate(-90deg)"
        ],
        tile2: [
          "translate(0, 0) rotate(0deg)",
          "translate(42, -16) rotate(90deg)",
          "translate(-20, -24) rotate(180deg)",
          "translate(26, 20) rotate(-90deg)"
        ],
        tile3: [
          "translate(0, 0) rotate(0deg)",
          "translate(-38, -26) rotate(90deg)",
          "translate(32, -18) rotate(180deg)",
          "translate(14, 18) rotate(-90deg)"
        ],
        tile4: [
          "translate(0, 0) rotate(0deg)",
          "translate(28, -28) rotate(90deg)",
          "translate(-32, 14) rotate(180deg)",
          "translate(18, 26) rotate(-90deg)"
        ],
        squiggle1: [
          "translate(0, 0) rotate(0deg)",
          "translate(22, 32) rotate(14deg)",
          "translate(-16, -18) rotate(-18deg)",
          "translate(36, -12) rotate(180deg)"
        ],
        squiggle2: [
          "translate(0, 0) rotate(0deg)",
          "translate(-28, 28) rotate(-15deg)",
          "translate(18, -16) rotate(16deg)",
          "translate(-18, 10) rotate(180deg)"
        ],
        signLeft: [
          "translate(175px, 655px) rotate(0deg)",
          "translate(145px, 645px) rotate(-6deg)",
          "translate(215px, 650px) rotate(5deg)",
          "translate(160px, 662px) rotate(-4deg)"
        ],
        miniArch: [
          "translate(475px, 675px) rotate(0deg)",
          "translate(540px, 668px) rotate(6deg)",
          "translate(410px, 670px) rotate(-5deg)",
          "translate(495px, 680px) rotate(0deg)"
        ],
        signRight: [
          "translate(1285px, 635px) rotate(0deg)",
          "translate(1310px, 622px) rotate(8deg)",
          "translate(1250px, 632px) rotate(-8deg)",
          "translate(1295px, 640px) rotate(180deg)"
        ],
        tunnel: [
          "translate(0px, 0px)",
          "translate(-55px, 6px)",
          "translate(35px, -4px)",
          "translate(-20px, 2px)"
        ],
        socialIg: [
          "translate(155px, 455px) rotate(0deg)",
          "translate(135px, 345px) rotate(-6deg)",
          "translate(210px, 510px) rotate(5deg)",
          "translate(175px, 265px) rotate(-4deg)"
        ],
        socialYt: [
          "translate(330px, 145px) rotate(0deg)",
          "translate(385px, 125px) rotate(8deg)",
          "translate(255px, 175px) rotate(-7deg)",
          "translate(1065px, 125px) rotate(6deg)"
        ],
        socialTw: [
          "translate(1285px, 435px) rotate(0deg)",
          "translate(1305px, 315px) rotate(6deg)",
          "translate(1245px, 505px) rotate(-5deg)",
          "translate(1270px, 250px) rotate(4deg)"
        ]
      };

      const NUMERAL_OFFSETS = [
        [
          "translate(474px, 358px) rotate(0deg)",
          "translate(598px, 358px) rotate(0deg)",
          "translate(750px, 358px) rotate(0deg)",
          "translate(874px, 358px) rotate(0deg)"
        ],
        [
          "translate(470px, 348px) rotate(-3deg)",
          "translate(598px, 366px) rotate(2deg)",
          "translate(750px, 348px) rotate(-2deg)",
          "translate(878px, 366px) rotate(3deg)"
        ],
        [
          "translate(474px, 364px) rotate(2deg)",
          "translate(594px, 348px) rotate(-3deg)",
          "translate(754px, 364px) rotate(3deg)",
          "translate(874px, 348px) rotate(-2deg)"
        ],
        [
          "translate(474px, 358px) rotate(0deg)",
          "translate(598px, 352px) rotate(2deg)",
          "translate(750px, 364px) rotate(-2deg)",
          "translate(874px, 356px) rotate(2deg)"
        ]
      ];

      const TRAIN_DESTINATIONS = [0.76, 0.34, 0.85, 0.56];

      const cards = [
        document.getElementById("card-h1"),
        document.getElementById("card-h2"),
        document.getElementById("card-m1"),
        document.getElementById("card-m2")
      ];

      const numeralGroups = [
        document.getElementById("totem-h1"),
        document.getElementById("totem-h2"),
        document.getElementById("totem-m1"),
        document.getElementById("totem-m2")
      ];

      const socialTotems = Array.from(document.querySelectorAll(".social-totem"));

      let lastShuffleTime = 0;

      function triggerShuffle() {
        const now = performance.now();
        if (now - lastShuffleTime < 260) return;
        lastShuffleTime = now;

        shuffleIndex = (shuffleIndex + 1) % 4;

        cards.forEach((card, i) => {
          card.classList.remove("tumbling");
          void card.offsetWidth;
          setTimeout(() => {
            card.classList.add("tumbling");
            numeralGroups[i].style.transform = NUMERAL_OFFSETS[shuffleIndex][i];
          }, i * 55);
        });

        Object.keys(SHUFFLE_PALETTES).forEach((key, idx) => {
          const els = document.querySelectorAll(`[data-shuffle-target="${key}"]`);
          els.forEach(el => {
            setTimeout(() => {
              el.style.transform = SHUFFLE_PALETTES[key][shuffleIndex];
            }, (idx % 6) * 45);
          });
        });

        socialTotems.forEach((badge, idx) => {
          badge.classList.remove("is-flipping");
          void badge.offsetWidth;
          setTimeout(() => {
            badge.classList.add("is-flipping");
          }, 90 + idx * 75);
        });

        trainState.targetProgress = TRAIN_DESTINATIONS[shuffleIndex];
        trainState.boostTimer = 1.65;
        trainGroup.classList.add("whistling");
        setTimeout(() => trainGroup.classList.remove("whistling"), 1500);
      }

      document.querySelectorAll(".totem-hover, .social-totem").forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          triggerShuffle();
        });
      });

      /* --------------------------------------------------------------------
         5. DETERMINISTIC CLOCK ENGINE
         -------------------------------------------------------------------- */
      let clockMode = "realtime";
      let demoVirtualMs = Date.now();
      let lastRealTick = performance.now();
      let lastRenderedMinute = null;

      const secondsText = document.getElementById("seconds-text");
      const dialRotator = document.getElementById("cobalt-dial-rotator");
      const zigzagPendulum = document.getElementById("zigzag-pendulum");
      const pendulumBob = document.getElementById("pendulum-bob");

      const statusPlaque = document.getElementById("status-plaque");
      const statusModeTitle = document.getElementById("status-mode-title");
      const statusModeSub = document.getElementById("status-mode-sub");
      const chassisModeLabel = document.getElementById("chassis-mode-label");

      function setClockMode(mode) {
        clockMode = mode;
        const isDemo = mode === "demo";

        statusPlaque.classList.toggle("is-demo", isDemo);
        if (isDemo) {
          demoVirtualMs = Date.now();
          lastRealTick = performance.now();
          statusModeTitle.textContent = "PREVIEW MODE // 12×";
          statusModeSub.textContent = "SIMULATED STREAM TEST";
          chassisModeLabel.textContent = "PREVIEW 12×";
        } else {
          statusModeTitle.textContent = "LIVE TIME // STANDBY";
          statusModeSub.textContent = "BROADCAST SYNC READY";
          chassisModeLabel.textContent = "STARTING LIVE";
        }
        lastRenderedMinute = null;
      }

      function updateClock(now) {
        let currentDate;
        if (clockMode === "realtime") {
          currentDate = new Date();
        } else {
          const deltaMs = now - lastRealTick;
          lastRealTick = now;
          demoVirtualMs += deltaMs * 12;
          currentDate = new Date(demoVirtualMs);
        }

        const hours = String(currentDate.getHours()).padStart(2, "0");
        const mins = String(currentDate.getMinutes()).padStart(2, "0");
        const secs = String(currentDate.getSeconds()).padStart(2, "0");
        const millis = currentDate.getMilliseconds();

        renderDigit("h1", hours[0], "#FBF7EE");
        renderDigit("h2", hours[1], "#FFE033");
        renderDigit("m1", mins[0], "#FBF7EE");
        renderDigit("m2", mins[1], "#FFE033");
        secondsText.textContent = secs;

        const exactSec = currentDate.getSeconds() + millis / 1000;
        const dialDeg = (exactSec / 60) * 360;
        dialRotator.setAttribute("transform", `rotate(${dialDeg.toFixed(2)})`);

        const swingAngle = Math.sin((exactSec * Math.PI)) * 24;
        zigzagPendulum.setAttribute("transform", `rotate(${swingAngle.toFixed(2)})`);
        pendulumBob.setAttribute("transform", `translate(0, 142) rotate(${(dialDeg * 2).toFixed(1)})`);

        const minuteStamp = `${hours}:${mins}`;
        if (lastRenderedMinute !== null && lastRenderedMinute !== minuteStamp) {
          triggerShuffle();
        }
        lastRenderedMinute = minuteStamp;

        requestAnimationFrame(updateClock);
      }

      /* --------------------------------------------------------------------
         6. BOOTSTRAP (Supports optional ?theme=bacterio|terrazzo|casablanca)
         -------------------------------------------------------------------- */
      const params = new URLSearchParams(window.location.search);
      const urlTheme = params.get("theme");
      const urlMode = params.get("mode");

      applyTheme(THEMES[urlTheme] ? urlTheme : "bacterio");
      setClockMode(urlMode === "demo" ? "demo" : "realtime");
      requestAnimationFrame(updateClock);
      requestAnimationFrame(animateTrain);
    })();
  </script>
</body>
