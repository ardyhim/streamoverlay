<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neo-Expressionist Street Art Starting + Live Chat</title>
  <style>
    :root {
      --canvas-black: #0b0708;
      --chalk-white: #f5f5ef;
      --raw-red: #e92426;
      --raw-orange: #ef7d14;
      --raw-yellow: #efb91a;
      --bright-yellow: #f4dc1a;
      --raw-cyan: #1fc1e6;
      --font-raw: 'Impact', 'Arial Black', 'Trebuchet MS', system-ui, sans-serif;
      --font-mono: 'Consolas', 'Courier New', ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: var(--font-raw);
      color: var(--chalk-white);
      user-select: none;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      overflow: hidden;
      background: var(--canvas-black);
    }

    .scene.is-transparent {
      background: transparent;
    }

    .scene.is-transparent #paint-bg-canvas {
      opacity: 0;
    }

    #paint-bg-canvas,
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #paint-bg-canvas {
      z-index: 1;
    }

    .mural-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #fx-canvas {
      z-index: 4;
    }

    .main-layout {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      padding: 3rem 3.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2.8rem;
      box-sizing: border-box;
    }

    .hero-col {
      flex: 1 1 58%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.35rem;
    }

    .center-card {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.8rem 2.6rem 1.7rem;
      background: rgba(11, 7, 8, 0.9);
      border: 4px solid var(--chalk-white);
      box-shadow:
        11px 11px 0 var(--raw-red),
        -9px -9px 0 var(--raw-cyan),
        0 24px 60px rgba(0, 0, 0, 0.85);
      transform: rotate(-1.2deg);
    }

    .center-card::before {
      content: "";
      position: absolute;
      inset: -10px;
      border: 3px dashed var(--raw-yellow);
      pointer-events: none;
      transform: rotate(1.6deg);
    }

    .crown-wrap {
      width: 7.5rem;
      height: auto;
      margin-bottom: -0.35rem;
    }

    .title-svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .meta-strip {
      margin-top: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      transform: rotate(1deg);
    }

    .timer-box {
      position: relative;
      background: var(--bright-yellow);
      color: var(--canvas-black);
      padding: 0.42rem 1.15rem;
      border: 3px solid var(--canvas-black);
      box-shadow: 5px 5px 0 var(--raw-cyan);
      display: flex;
      align-items: baseline;
      gap: 0.65rem;
    }

    .timer-label {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .timer-digits {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--raw-red);
      color: var(--chalk-white);
      padding: 0.5rem 1rem;
      border: 3px solid var(--chalk-white);
      box-shadow: 5px 5px 0 var(--raw-orange);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--bright-yellow);
      animation: dotBlink 0.9s steps(2) infinite;
    }

    .social-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1rem;
      width: 100%;
    }

    .social-tag {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1.05rem;
      border: 3px solid var(--chalk-white);
      font-family: var(--font-mono);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .social-tag--ig {
      background: var(--raw-red);
      color: var(--chalk-white);
      box-shadow: 6px 6px 0 var(--bright-yellow);
      transform: rotate(-1.8deg);
    }

    .social-tag--tt {
      background: var(--raw-cyan);
      color: var(--canvas-black);
      border-color: var(--canvas-black);
      box-shadow: 6px 6px 0 var(--raw-red);
      transform: rotate(1.4deg);
    }

    .social-tag--yt {
      background: var(--bright-yellow);
      color: var(--canvas-black);
      border-color: var(--canvas-black);
      box-shadow: 6px 6px 0 var(--raw-cyan);
      transform: rotate(-1.2deg);
    }

    .social-icon {
      width: 1.35rem;
      height: 1.35rem;
      flex-shrink: 0;
    }

    .social-label {
      font-size: 0.72rem;
      opacity: 0.88;
      display: block;
      line-height: 1;
      margin-bottom: 0.15rem;
    }

    .social-handle {
      font-size: 1.05rem;
      line-height: 1;
      display: block;
    }

    .chat-col {
      flex: 0 0 36%;
      height: 78%;
      display: flex;
      flex-direction: column;
      position: relative;
      margin-top: 3.2rem;
    }

    .chat-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(11, 7, 8, 0.93);
      border: 4px solid var(--chalk-white);
      box-shadow:
        11px 11px 0 var(--raw-cyan),
        -8px -8px 0 var(--raw-orange),
        0 22px 54px rgba(0, 0, 0, 0.85);
    }

    .chat-frame::before {
      content: "";
      position: absolute;
      inset: -9px;
      border: 3px dashed var(--raw-red);
      pointer-events: none;
      transform: rotate(-0.8deg);
    }

    .chat-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.15rem;
      background: var(--raw-orange);
      color: var(--canvas-black);
      border-bottom: 4px solid var(--chalk-white);
      z-index: 2;
    }

    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--font-raw);
      font-size: 1.45rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .chat-header-badge {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 900;
      padding: 0.25rem 0.6rem;
      background: var(--canvas-black);
      color: var(--bright-yellow);
      border: 2px solid var(--chalk-white);
      letter-spacing: 0.1em;
    }

    .chat-drips {
      position: absolute;
      left: 0;
      top: 100%;
      width: 100%;
      height: 22px;
      pointer-events: none;
      z-index: 3;
    }

    .chat-body {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      background: #0b0708;
      overflow: hidden;
    }

    .chat-iframe {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    .chat-fallback {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: rgba(245, 245, 239, 0.45);
      letter-spacing: 0.06em;
      line-height: 1.5;
    }

    .boil-slow {
      transform-box: fill-box;
      transform-origin: center;
      animation: sketchBoilA 0.55s steps(3) infinite;
    }

    .boil-fast {
      transform-box: fill-box;
      transform-origin: center;
      animation: sketchBoilB 0.42s steps(3) infinite;
    }

    .crown-float {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: crownJitter 1.4s steps(4) infinite;
    }

    .dog-jaw {
      transform-box: fill-box;
      transform-origin: 85% 35%;
      animation: jawSnap 1.8s steps(3) infinite;
    }

    .dog-tail {
      transform-box: fill-box;
      transform-origin: left bottom;
      animation: tailWag 0.7s steps(3) infinite alternate;
    }

    .spring-coil {
      transform-box: fill-box;
      transform-origin: top center;
      animation: springBounce 2.2s ease-in-out infinite;
    }

    .chalk-draw {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: chalkTrace 5.5s ease-in-out infinite;
    }

    .chalk-draw--delay {
      animation-delay: -2.4s;
    }

    .drip-ooze {
      transform-box: fill-box;
      transform-origin: top center;
      animation: dripStretch 5.2s ease-in-out infinite;
    }

    .drip-ooze--2 {
      animation-duration: 6.6s;
      animation-delay: -1.9s;
    }

    .drip-ooze--3 {
      animation-duration: 4.6s;
      animation-delay: -3.1s;
    }

    .eye-flicker {
      animation: eyeFlicker 2.4s steps(2) infinite;
    }

    .paint-jitter-red {
      animation: jitterOffsetRed 3.5s steps(1) infinite;
    }

    .paint-jitter-cyan {
      animation: jitterOffsetCyan 3.5s steps(1) infinite;
    }

    @keyframes sketchBoilA {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(1.8px, -1.4px) rotate(0.7deg); }
      66% { transform: translate(-1.6px, 1.5px) rotate(-0.6deg); }
      100% { transform: translate(0.8px, 0.8px) rotate(0.3deg); }
    }

    @keyframes sketchBoilB {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-2px, 1.5px) scale(1.015); }
      66% { transform: translate(1.8px, -1.8px) scale(0.99); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes crownJitter {
      0% { transform: rotate(-4deg) translateY(0); }
      25% { transform: rotate(-1deg) translateY(-3px); }
      50% { transform: rotate(-6deg) translateY(1px); }
      75% { transform: rotate(-2deg) translateY(-2px); }
      100% { transform: rotate(-4deg) translateY(0); }
    }

    @keyframes jawSnap {
      0%, 70%, 100% { transform: rotate(0deg); }
      78% { transform: rotate(-9deg); }
      88% { transform: rotate(3deg); }
    }

    @keyframes tailWag {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(14deg); }
    }

    @keyframes springBounce {
      0%, 100% { transform: scaleY(0.94); }
      50% { transform: scaleY(1.08); }
    }

    @keyframes chalkTrace {
      0% { stroke-dashoffset: 520; opacity: 0.35; }
      30%, 78% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -520; opacity: 0.35; }
    }

    @keyframes dripStretch {
      0%, 15% { transform: scaleY(0.75); }
      55% { transform: scaleY(1.18); }
      88%, 100% { transform: scaleY(0.75); }
    }

    @keyframes eyeFlicker {
      0%, 82%, 100% { opacity: 1; }
      86%, 94% { opacity: 0.25; }
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    @keyframes jitterOffsetRed {
      0%, 90%, 100% { transform: translate(6px, 5px); }
      93% { transform: translate(10px, 2px); }
      96% { transform: translate(3px, 8px); }
    }

    @keyframes jitterOffsetCyan {
      0%, 88%, 100% { transform: translate(-6px, -4px); }
      91% { transform: translate(-11px, -1px); }
      95% { transform: translate(-4px, -7px); }
    }
  </style>
</head>

    <canvas id="paint-bg-canvas"></canvas>

        <circle cx="1552" cy="340" r="20" fill="none" stroke="#f4dc1a" stroke-width="5.5" />

    <canvas id="fx-canvas"></canvas>

    <main class="main-layout">

            <line class="chalk-draw" x1="88" y1="122" x2="632" y2="118" stroke="#1fc1e6" stroke-width="6" stroke-linecap="round" />
            <text id="sub-main" x="360" y="190" text-anchor="middle" font-size="56" font-family="Impact, Arial Black, sans-serif" font-weight="900" letter-spacing="18" fill="#0b0708">SOON</text>
          </svg>

          <div class="meta-strip">
            <div class="timer-box" id="timer-box">
              <span class="timer-label">DROP</span>
              <span class="timer-digits" id="timer-digits">05:00</span>

        </div>

        <div class="social-strip">
          <div class="social-tag social-tag--ig">

              <span class="social-handle">@ardyhim</span>

          <div class="social-tag social-tag--tt">
            <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 3v11.5a4 4 0 1 1-3-3.87"></path>
              <path d="M14 3c1.1 2.7 3.2 4.3 6 4.7"></path>
            </svg>
            <div>
              <span class="social-label">TIKTOK</span>
              <span class="social-handle">@ardyhim</span>

          </div>

          <div class="social-tag social-tag--yt">
            <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.2" y="5" width="19.6" height="14" rx="4"></rect>
              <polygon points="10,9 16,12 10,15" fill="currentColor" stroke="none"></polygon>
            </svg>
            <div>
              <span class="social-label">YOUTUBE</span>
              <span class="social-handle">@ardyhim</span>
            </div>
          </div>
        </div>
      </section>

      <aside class="chat-col">
        <div class="chat-frame">
          <div class="chat-header">
            <span class="chat-header-title">
              <span>LIVE CHAT</span>
            </span>
            <span class="chat-header-badge">YT // STREAM</span>
            <svg class="chat-drips" viewBox="0 0 400 22" preserveAspectRatio="none" aria-hidden="true">
              <path class="drip-ooze" d="M36,0 L48,0 L46,16 C44,21 38,21 37,15 Z" fill="#ef7d14" />
              <path class="drip-ooze drip-ooze--2" d="M180,0 L194,0 L191,20 C189,23 183,23 182,19 Z" fill="#ef7d14" />
              <path class="drip-ooze drip-ooze--3" d="M324,0 L336,0 L334,15 C332,20 326,20 325,14 Z" fill="#ef7d14" />
            </svg>
          </div>

          <div class="chat-body">
            <div class="chat-fallback">
              <span>LIVE CHAT ID: <strong id="chat-id-label">4a3M-cp1wFc</strong></span>
              <span>Gunakan server lokal (localhost) / hosting agar iframe YouTube aktif, atau timpa area ini dengan Browser Source Live Chat OBS.</span>
            </div>
            <iframe
              id="yt-chat-frame"
              class="chat-iframe"
              title="YouTube Live Chat"
              allowtransparency="true"
            ></iframe>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);

      function pick(keys, fallback) {
        for (var i = 0; i < keys.length; i += 1) {
          var value = params.get(keys[i]);
          if (value !== null && value !== '') {
            return value;
          }
        }
        return fallback;
      }

      function flag(keys, fallback) {
        var value = pick(keys, null);
        if (value === null) {
          return fallback;
        }
        return value === '1' || value === 'true';
      }

      var sceneEl = document.getElementById('scene');

      var isTransparent =
        flag(['transparent'], false) ||
        (pick(['bg'], '') || '').toLowerCase() === 'transparent';
      if (isTransparent) {
        sceneEl.classList.add('is-transparent');
      }

      var customTitle = pick(['title'], null);
      if (customTitle) {
        var upperTitle = customTitle.toUpperCase();
        document.getElementById('title-cyan').textContent = upperTitle;
        document.getElementById('title-red').textContent = upperTitle;
        document.getElementById('title-main').textContent = upperTitle;
      }

      var customSub = pick(['subtitle', 'sub'], null);
      if (customSub) {
        document.getElementById('sub-main').textContent = customSub.toUpperCase();
      }

      var customMsg = pick(['message', 'msg'], null);
      if (customMsg) {
        document.getElementById('status-msg').textContent = customMsg.toUpperCase();
      }

      var chatMode = (pick(['chat'], 'box') || 'box').toLowerCase();
      var chatIdParam = pick(['chatId', 'v'], null);
      if (chatIdParam === null) {
        var legacyChatId = (params.get('chat') || '').trim();
        if (legacyChatId && ['off', 'none', 'hide', 'box'].indexOf(legacyChatId.toLowerCase()) === -1) {
          chatIdParam = legacyChatId;
        }
      }
      var chatHidden =
        chatMode === 'off' ||
        chatMode === 'none' ||
        chatMode === 'hide' ||
        chatIdParam === '0';
      var chatId = chatIdParam && chatIdParam !== '0' ? chatIdParam : '4a3M-cp1wFc';
      var embedDomain = pick(['domain'], window.location.hostname || 'localhost');
      var chatIframe = document.getElementById('yt-chat-frame');
      if (chatHidden) {
        chatIframe.style.display = 'none';
        document.getElementById('chat-id-label').textContent = 'CHAT OFF';
      } else {
        document.getElementById('chat-id-label').textContent = chatId;
        chatIframe.src =
          'https://www.youtube.com/live_chat?v=' +
          encodeURIComponent(chatId) +
          '&embed_domain=' +
          encodeURIComponent(embedDomain) +
          '&dark_theme=1';
      }

      var secondsParam = pick(['seconds', 'sec'], null);
      var minutesParam = pick(['minus', 'minutes', 'min'], null);
      var totalSeconds = 300;
      if (secondsParam !== null) {
        totalSeconds = Math.max(0, parseInt(secondsParam, 10) || 0);
      } else if (minutesParam !== null) {
        totalSeconds = Math.max(0, Math.round((parseFloat(minutesParam) || 0) * 60));
      }

      var timerBox = document.getElementById('timer-box');
      var digitsEl = document.getElementById('timer-digits');

      if (totalSeconds <= 0) {
        timerBox.style.display = 'none';
      } else {
        function renderClock(sec) {
          var m = Math.floor(sec / 60);
          var s = sec % 60;
          var mm = m < 10 ? '0' + m : '' + m;
          var ss = s < 10 ? '0' + s : '' + s;
          digitsEl.textContent = mm + ':' + ss;
        }

        renderClock(totalSeconds);
        var clockTimer = setInterval(function () {
          totalSeconds -= 1;
          if (totalSeconds <= 0) {
            clearInterval(clockTimer);
            digitsEl.textContent = '00:00';
            document.getElementById('status-msg').textContent = 'LIVE NOW';
            return;
          }
          renderClock(totalSeconds);
        }, 1000);
      }

      function mulberry32(seed) {
        return function () {
          var t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      var bgCanvas = document.getElementById('paint-bg-canvas');
      var bgCtx = bgCanvas.getContext('2d');

      function drawDryBrushBlock(ctx, x, y, w, h, color, rand, horizontal) {
        ctx.fillStyle = color;
        var strips = horizontal ? 26 : 22;
        for (var i = 0; i < strips; i++) {
          var t = i / strips;
          if (horizontal) {
            var sy = y + t * h;
            var sh = (h / strips) * (0.65 + rand() * 0.9);
            var sx = x + (rand() - 0.5) * 30;
            var sw = w + (rand() - 0.5) * 40;
            ctx.globalAlpha = 0.55 + rand() * 0.45;
            ctx.fillRect(sx, sy, sw, sh);
          } else {
            var sx2 = x + t * w;
            var sw2 = (w / strips) * (0.65 + rand() * 0.9);
            var sy2 = y + (rand() - 0.5) * 30;
            var sh2 = h + (rand() - 0.5) * 40;
            ctx.globalAlpha = 0.55 + rand() * 0.45;
            ctx.fillRect(sx2, sy2, sw2, sh2);
          }
        }

        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#0b0708';
        for (var s = 0; s < 32; s++) {
          var gx = x + rand() * w;
          var gy = y + rand() * h;
          ctx.fillRect(gx, gy, 3 + rand() * 16, 1.5 + rand() * 5);
        }
        ctx.globalAlpha = 1;
      }

      function renderPaintedBackdrop() {
        var W = sceneEl.clientWidth || 1920;
        var H = sceneEl.clientHeight || 1080;
        bgCanvas.width = W;
        bgCanvas.height = H;

        var rand = mulberry32(84729);
        var sx = W / 1600;
        var sy = H / 900;

        bgCtx.fillStyle = '#0b0708';
        bgCtx.fillRect(0, 0, W, H);

        drawDryBrushBlock(bgCtx, 310 * sx, 20 * sy, 760 * sx, 85 * sy, '#1fc1e6', rand, true);
        drawDryBrushBlock(bgCtx, 390 * sx, 85 * sy, 180 * sx, 340 * sy, '#ef7d14', rand, false);
        drawDryBrushBlock(bgCtx, 600 * sx, 150 * sy, 320 * sx, 230 * sy, '#e92426', rand, true);

        drawDryBrushBlock(bgCtx, 38 * sx, 515 * sy, 310 * sx, 330 * sy, '#e92426', rand, false);
        drawDryBrushBlock(bgCtx, 25 * sx, 225 * sy, 165 * sx, 250 * sy, '#f5f5ef', rand, false);
        drawDryBrushBlock(bgCtx, 48 * sx, 140 * sy, 240 * sx, 145 * sy, '#e92426', rand, true);

        drawDryBrushBlock(bgCtx, 380 * sx, 725 * sy, 580 * sx, 105 * sy, '#1fc1e6', rand, true);
        drawDryBrushBlock(bgCtx, 1040 * sx, 140 * sy, 480 * sx, 260 * sy, '#ef7d14', rand, true);
        drawDryBrushBlock(bgCtx, 1120 * sx, 560 * sy, 440 * sx, 280 * sy, '#f4dc1a', rand, true);

        var palette = ['#f5f5ef', '#1fc1e6', '#e92426', '#efb91a', '#ef7d14', '#0b0708'];
        for (var k = 0; k < 1050; k++) {
          bgCtx.fillStyle = palette[Math.floor(rand() * palette.length)];
          bgCtx.globalAlpha = 0.25 + rand() * 0.65;
          var px = rand() * W;
          var py = rand() * H;
          var pr = 0.8 + rand() * 3.5;
          bgCtx.beginPath();
          bgCtx.arc(px, py, pr, 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.globalAlpha = 1;
      }

      var fxCanvas = document.getElementById('fx-canvas');
      var fxCtx = fxCanvas.getContext('2d');
      var fxColors = ['#f5f5ef', '#1fc1e6', '#e92426', '#f4dc1a'];
      var specks = [];

      function resizeAll() {
        renderPaintedBackdrop();
        fxCanvas.width = sceneEl.clientWidth || 1920;
        fxCanvas.height = sceneEl.clientHeight || 1080;
      }

      function spawnSpeck(randomY) {
        return {
          x: Math.random() * (fxCanvas.width || 1920),
          y: randomY ? Math.random() * (fxCanvas.height || 1080) : (fxCanvas.height || 1080) + 10,
          size: 1.5 + Math.random() * 3,
          vx: (Math.random() - 0.5) * 0.45,
          vy: -(0.3 + Math.random() * 0.7),
          alpha: 0.25 + Math.random() * 0.55,
          color: fxColors[Math.floor(Math.random() * fxColors.length)],
          isCross: Math.random() > 0.86
        };
      }

      resizeAll();
      window.addEventListener('resize', resizeAll);

      for (var n = 0; n < 36; n++) {
        specks.push(spawnSpeck(true));
      }

      function tickFx() {
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        for (var i = 0; i < specks.length; i++) {
          var p = specks[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.y < -15 || p.x < -15 || p.x > fxCanvas.width + 15) {
            specks[i] = spawnSpeck(false);
            p = specks[i];
          }

          fxCtx.globalAlpha = p.alpha;
          if (p.isCross) {
            fxCtx.strokeStyle = p.color;
            fxCtx.lineWidth = 2;
            fxCtx.beginPath();
            fxCtx.moveTo(p.x - p.size * 1.6, p.y - p.size * 1.6);
            fxCtx.lineTo(p.x + p.size * 1.6, p.y + p.size * 1.6);
            fxCtx.moveTo(p.x + p.size * 1.6, p.y - p.size * 1.6);
            fxCtx.lineTo(p.x - p.size * 1.6, p.y + p.size * 1.6);
            fxCtx.stroke();
          } else {
            fxCtx.fillStyle = p.color;
            fxCtx.fillRect(p.x, p.y, p.size, p.size);
          }
        }
        fxCtx.globalAlpha = 1;
        requestAnimationFrame(tickFx);
      }

      requestAnimationFrame(tickFx);
    })();
  </script>
