<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Helvetica Neue", Arial, system-ui, -apple-system, sans-serif;
      color: #0b0b0d;
      -webkit-font-smoothing: antialiased;
    }

    img[src=""],
    img[src*="{"] {
      display: none !important;
    }

    .alert-stage {
      width: 100%;
      box-sizing: border-box;
      padding: 0.7rem 0.45rem 0.5rem 1.85rem;
      animation: alertEnter 0.48s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .sheet {
      position: relative;
      width: 100%;
      box-sizing: border-box;
      background-color: #ffffff;
      background-image:
        radial-gradient(circle, rgba(11, 11, 13, 0.14) 1.25px, transparent 1.35px);
      background-size: 0.42rem 0.42rem;
      background-position: right bottom;
      border: 2px solid #0b0b0d;
      box-shadow: 0.28rem 0.28rem 0 0 #0b0b0d;
      padding: 0.85rem 1.05rem 0.8rem 1.15rem;
    }

    /* Mask halus agar pola titik halftone berkumpul di sisi kanan saja */
    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #ffffff 36%, rgba(255, 255, 255, 0.82) 72%, rgba(255, 255, 255, 0.25) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Tab label editorial yang menembus garis atas */
    .eyebrow-tab {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: -1.42rem;
      margin-bottom: 0.55rem;
    }

    .eyebrow-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #0b0b0d;
      color: #ffffff;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
    }

    .eyebrow-dot {
      width: 0.38rem;
      height: 0.38rem;
      border-radius: 50%;
      background: #e0351b;
    }

    .media-tag {
      display: none;
      background: #ffffff;
      color: #0b0b0d;
      border: 1.5px solid #0b0b0d;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 0.14rem 0.42rem;
    }

    .header-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* Avatar keluar ke kiri dengan aura titik halftone melingkar */
    .avatar-cluster {
      position: relative;
      width: 3.35rem;
      height: 3.35rem;
      margin-left: -2.55rem;
      flex-shrink: 0;
    }

    .avatar-aura {
      position: absolute;
      inset: -0.45rem;
      border-radius: 50%;
      background-image: radial-gradient(circle, #0b0b0d 1.3px, transparent 1.45px);
      background-size: 0.32rem 0.32rem;
      opacity: 0.72;
      z-index: 0;
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: 3.35rem;
      height: 3.35rem;
      border-radius: 50%;
      border: 2px solid #0b0b0d;
      background: #ffffff;
      object-fit: cover;
      display: none;
    }

    .avatar-fallback {
      position: relative;
      z-index: 1;
      width: 3.35rem;
      height: 3.35rem;
      box-sizing: border-box;
      border-radius: 50%;
      border: 2px solid #0b0b0d;
      background: #ffffff;
      color: #0b0b0d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Impact, "Arial Narrow", "Arial Black", sans-serif;
      font-size: 1.35rem;
      line-height: 1;
    }

    .gifter-meta {
      flex: 1;
      min-width: 0;
    }

    .name-line {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .gifter-name {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #0b0b0d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified-seal {
      display: none;
      flex-shrink: 0;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: #0b0b0d;
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 900;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.28rem;
      margin-top: 0.22rem;
    }

    .badges:empty {
      display: none;
    }

    .badge-icon {
      width: 1.05rem;
      height: 1.05rem;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .badge-tag {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #0b0b0d;
      border: 1px solid rgba(11, 11, 13, 0.38);
      background: #ffffff;
      padding: 0.04rem 0.32rem;
    }

    .amount-block {
      flex-shrink: 0;
      text-align: right;
    }

    .amount-value {
      font-family: Impact, "Arial Narrow", "Helvetica Condensed", "Arial Black", sans-serif;
      font-size: 1.7rem;
      line-height: 0.92;
      letter-spacing: 0.02em;
      color: #0b0b0d;
      text-transform: uppercase;
    }

    /* Pemisah titik halftone tipis */
    .dot-divider {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 0.22rem;
      margin: 0.62rem 0 0.55rem;
      background-image: radial-gradient(circle, #0b0b0d 1px, transparent 1.1px);
      background-size: 0.34rem 0.22rem;
      opacity: 0.45;
    }

    .message {
      position: relative;
      z-index: 2;
      font-size: 0.94rem;
      line-height: 1.44;
      font-weight: 500;
      color: #1c1c21;
      word-break: break-word;
    }

    .footer-strip {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    .barcode-mini {
      width: 3.6rem;
      height: 0.55rem;
      background: repeating-linear-gradient(
        90deg,
        #0b0b0d 0px, #0b0b0d 2px,
        transparent 2px, transparent 4px,
        #0b0b0d 4px, #0b0b0d 5px,
        transparent 5px, transparent 7px
      );
      opacity: 0.72;
    }

    .stamp {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(11, 11, 13, 0.58);
    }

    @keyframes alertEnter {
      0% {
        opacity: 0;
        transform: translateY(0.9rem) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="alert-stage">
    <div class="sheet">
      <div class="eyebrow-tab">
        <span class="eyebrow-pill">
          <span class="eyebrow-dot"></span>
          <span>GIFT ALERT</span>
        </span>
        <span class="media-tag" id="media-tag"></span>
      </div>

      <div class="header-row">
        <div class="avatar-cluster">
          <div class="avatar-aura"></div>
          <img class="avatar" id="avatar" src="" alt="" />
          <div class="avatar-fallback" id="avatar-fallback">&#9733;</div>
        </div>

        <div class="gifter-meta">
          <div class="name-line">
            <span class="gifter-name" id="gifter-name">{{gifterName}}</span>
            <span class="verified-seal" id="verified-seal">&#10003;</span>
          </div>
          <div class="badges" id="badges"></div>
        </div>

        <div class="amount-block">
          <div class="amount-value" id="amount-value">{{formattedAmount}}</div>
        </div>
      </div>

      <div class="dot-divider" id="dot-divider"></div>

      <div class="message" id="message">{{message}}</div>

      <div class="footer-strip" id="footer-strip">
        <span class="barcode-mini"></span>
        <span class="stamp" id="stamp">{{timestamp}}</span>
      </div>
    </div>
  </div>

  <script>
    const picture = "{{gifterPicture}}".trim();
    const badgesRaw = "{{gifterBadges}}".trim();
    const isVerified = "{{isGifterVerified}}" === "true";
    const mediaDuration = "{{mediaDuration}}".trim();
    const showTimestamp = "{{showTimestamp}}" === "true";

    const BADGE_ICON_URLS = {
      "Tako Verified Partner": "https://tako.id/images/badges/partnered-creator.png",
      "Tako Verified Creator": "https://tako.id/images/badges/verified-creator.png",
      "Rich Rich Club": "https://tako.id/images/badges/king.png",
      "Charity": "https://tako.id/images/badges/charity.png",
      "VTuber": "https://tako.id/images/badges/vtuber.png",
      "Tako Team": "https://tako.id/images/badges/admin.png"
    };

    const avatar = document.getElementById("avatar");
    const avatarFallback = document.getElementById("avatar-fallback");
    const verifiedSeal = document.getElementById("verified-seal");
    const badgesEl = document.getElementById("badges");
    const messageEl = document.getElementById("message");
    const dotDivider = document.getElementById("dot-divider");
    const mediaTag = document.getElementById("media-tag");
    const stampEl = document.getElementById("stamp");
    const gifterNameEl = document.getElementById("gifter-name");
    const amountEl = document.getElementById("amount-value");

    if (gifterNameEl.textContent.includes("{{")) {
      gifterNameEl.textContent = "Supporter";
    }

    if (amountEl.textContent.includes("{{")) {
      amountEl.textContent = "IDR 0";
    }

    if (picture && !picture.includes("{{")) {
      avatar.src = picture;
      avatar.style.display = "block";
      avatarFallback.style.display = "none";
      avatar.onerror = function () {
        avatar.style.display = "none";
        avatarFallback.style.display = "flex";
      };
    }

    if (isVerified) {
      verifiedSeal.style.display = "inline-flex";
    }

    if (badgesRaw && !badgesRaw.includes("{{")) {
      badgesRaw.split(",").map(function (b) { return b.trim(); }).filter(Boolean).forEach(function (entry) {
        const isUrl = entry.startsWith("https://") || entry.startsWith("http://") || entry.startsWith("/");
        const iconUrl = isUrl ? entry : BADGE_ICON_URLS[entry];

        if (iconUrl) {
          const icon = document.createElement("img");
          icon.className = "badge-icon";
          icon.src = iconUrl;
          icon.alt = isUrl ? "Badge" : entry;
          icon.title = isUrl ? "" : entry;
          icon.onerror = function () {
            if (isUrl) {
              icon.style.display = "none";
            } else {
              const fallbackTag = document.createElement("span");
              fallbackTag.className = "badge-tag";
              fallbackTag.textContent = entry;
              icon.replaceWith(fallbackTag);
            }
          };
          badgesEl.appendChild(icon);
        } else {
          const tag = document.createElement("span");
          tag.className = "badge-tag";
          tag.textContent = entry;
          badgesEl.appendChild(tag);
        }
      });
    }

    const msgText = messageEl.textContent.trim();
    if (!msgText || msgText.includes("{{")) {
      messageEl.style.display = "none";
      dotDivider.style.display = "none";
    }

    if (mediaDuration && !mediaDuration.includes("{{") && Number(mediaDuration) > 0) {
      mediaTag.textContent = mediaDuration + "S";
      mediaTag.style.display = "inline-block";
    }

    const stampText = stampEl.textContent.trim();
    if (!showTimestamp || !stampText || stampText.includes("{{")) {
      stampEl.style.display = "none";
    }
  </script>
</body>
</html>
