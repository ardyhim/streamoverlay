<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Helvetica Neue", Arial, system-ui, -apple-system, sans-serif;
      color: #0b0b0d;
      -webkit-font-smoothing: antialiased;
    }

    img[src=""],
    img[src*="{"] {
      display: none !important;
    }

    .song-stage {
      width: 100%;
      box-sizing: border-box;
      padding: 0.35rem 0.4rem 0.45rem 0.25rem;
    }

    .sleeve-card {
      position: relative;
      width: 100%;
      box-sizing: border-box;
      background-color: #ffffff;
      background-image:
        radial-gradient(circle, rgba(11, 11, 13, 0.13) 1.2px, transparent 1.3px);
      background-size: 0.4rem 0.4rem;
      background-position: right bottom;
      border: 2px solid #0b0b0d;
      box-shadow: 0.26rem 0.26rem 0 0 #0b0b0d;
      padding: 0.78rem 0.92rem;
    }

    .sleeve-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #ffffff 42%, rgba(255, 255, 255, 0.86) 76%, rgba(255, 255, 255, 0.3) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .error-banner {
      position: relative;
      z-index: 2;
      display: none;
      margin-bottom: 0.5rem;
      padding: 0.28rem 0.5rem;
      background: #0b0b0d;
      color: #ffffff;
      border-left: 0.22rem solid #e0351b;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.3;
    }

    .gap-banner {
      position: relative;
      z-index: 2;
      display: none;
      padding: 0.85rem 0.5rem;
      text-align: center;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0b0b0d;
    }

    .player-body {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.95rem;
      flex-wrap: nowrap;
    }

    /* Cover sleeve + piringan vinyl statis mengintip di kanan */
    .cover-cluster {
      position: relative;
      width: 5.55rem;
      height: 4.75rem;
      flex-shrink: 0;
    }

    .vinyl-peek {
      position: absolute;
      right: 0;
      top: 0.2rem;
      width: 4.35rem;
      height: 4.35rem;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #ffffff 0.35rem, #0b0b0d 0.38rem, #0b0b0d 0.95rem, #1d1d22 0.98rem, #0b0b0d 1.45rem, #24242a 1.48rem, #0b0b0d 2.2rem);
      border: 1.5px solid #0b0b0d;
      z-index: 0;
    }

    .cover-box {
      position: relative;
      z-index: 1;
      width: 4.75rem;
      height: 4.75rem;
      border: 2px solid #0b0b0d;
      background: #ffffff;
      overflow: hidden;
    }

    .cover-fallback {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      background-image: radial-gradient(circle, rgba(11, 11, 13, 0.2) 1.2px, transparent 1.3px);
      background-size: 0.35rem 0.35rem;
      font-family: Impact, "Arial Narrow", "Arial Black", sans-serif;
      font-size: 1.55rem;
      color: #0b0b0d;
    }

    .cover-img {
      position: relative;
      z-index: 1;
      width: 4.75rem;
      height: 4.75rem;
      display: block;
      object-fit: cover;
    }

    .track-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.24rem;
    }

    /* Baris status & waktu terkunci tingginya */
    .meta-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      height: 1.05rem;
      flex-wrap: nowrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #0b0b0d;
      white-space: nowrap;
    }

    .status-dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      background: #e0351b;
      flex-shrink: 0;
    }

    [data-paused="true"] .status-dot {
      background: rgba(11, 11, 13, 0.38);
    }

    .time-el {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: rgba(11, 11, 13, 0.72);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .title-el {
      height: 1.48rem;
      line-height: 1.48rem;
      font-family: Impact, "Arial Narrow", "Helvetica Condensed", "Arial Black", sans-serif;
      font-size: 1.28rem;
      letter-spacing: 0.015em;
      text-transform: uppercase;
      color: #0b0b0d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-el {
      height: 1.05rem;
      line-height: 1.05rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: rgba(11, 11, 13, 0.64);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-row {
      margin-top: 0.12rem;
      margin-bottom: 0.1rem;
    }

    .bar-bg {
      width: 100%;
      height: 0.34rem;
      background: #ffffff;
      border: 1.5px solid #0b0b0d;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Wajib tanpa transition: width untuk progress-tick */
    .bar-fill {
      height: 100%;
      background: #0b0b0d;
    }

    .requester-row {
      display: flex;
      align-items: center;
      gap: 0.36rem;
      height: 1.3rem;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .req-prefix {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: rgba(11, 11, 13, 0.56);
      flex-shrink: 0;
    }

    .requester-pic {
      width: 1.15rem;
      height: 1.15rem;
      border-radius: 50%;
      border: 1px solid #0b0b0d;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
    }

    .requester-name {
      font-size: 0.76rem;
      font-weight: 800;
      color: #0b0b0d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .requester-verified {
      display: none;
      width: 0.88rem;
      height: 0.88rem;
      border-radius: 50%;
      background: #0b0b0d;
      color: #ffffff;
      font-size: 0.55rem;
      font-weight: 900;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }

    .requester-verified[data-verified="true"] {
      display: inline-flex;
    }

    .requester-badges {
      display: flex;
      align-items: center;
      gap: 0.22rem;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    .requester-badges:empty {
      display: none;
    }

    .req-badge-icon {
      width: 0.95rem;
      height: 0.95rem;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }

    .req-badge-tag {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #0b0b0d;
      border: 1px solid rgba(11, 11, 13, 0.36);
      background: #ffffff;
      padding: 0 0.24rem;
      line-height: 1.25;
      white-space: nowrap;
    }

    /* ================= SETLIST / ANTRIAN BERIKUTNYA ================= */
    .setlist-wrap {
      position: relative;
      z-index: 2;
      display: none;
      margin-top: 0.65rem;
      padding-top: 0.55rem;
      border-top: 1.5px solid #0b0b0d;
    }

    .setlist-label {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(11, 11, 13, 0.6);
      margin-bottom: 0.35rem;
    }

    .setlist-body {
      display: flex;
      flex-direction: column;
    }

    .setlist-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 1.65rem;
      flex-wrap: nowrap;
      border-bottom: 1px solid rgba(11, 11, 13, 0.14);
    }

    .setlist-row:last-child {
      border-bottom: 0;
    }

    .setlist-num {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.66rem;
      font-weight: 700;
      color: rgba(11, 11, 13, 0.52);
      width: 1.25rem;
      flex-shrink: 0;
    }

    .setlist-track {
      flex: 1;
      min-width: 0;
      font-size: 0.74rem;
      font-weight: 700;
      color: #0b0b0d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .setlist-artist {
      font-weight: 500;
      color: rgba(11, 11, 13, 0.62);
    }

    .setlist-sender {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
      max-width: 8.5rem;
    }

    .setlist-sender-name {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.64rem;
      color: rgba(11, 11, 13, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .setlist-badge-icon {
      width: 0.85rem;
      height: 0.85rem;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="song-stage" id="song-stage" data-playing="{{isPlaying}}" data-paused="{{isPaused}}" data-gap="{{isInGap}}">
    <div class="sleeve-card">
      <div class="error-banner" id="error-banner"></div>
      <div class="gap-banner" id="gap-banner"></div>

      <div class="player-body" id="player-body">
        <div class="cover-cluster">
          <div class="vinyl-peek"></div>
          <div class="cover-box">
            <div class="cover-fallback" id="cover-fallback">&#9835;</div>
            <img
              class="cover-img"
              id="cover-img"
              src="{{songCoverArtUrl}}"
              alt=""
              onerror="this.style.display='none'"
            />
          </div>
        </div>

        <div class="track-col">
          <div class="meta-top-row">
            <span class="status-badge">
              <span class="status-dot"></span>
              <span id="status-el">NOW PLAYING</span>
            </span>
            <span class="time-el" id="time-el" data-elapsed="{{elapsed}}" data-duration="{{duration}}">{{formattedElapsed}} / {{formattedDuration}}</span>
          </div>

          <div class="title-el" id="title-el">{{songTitle}}</div>
          <div class="artist-el" id="artist-el">{{songArtist}}</div>

          <div class="progress-row" id="progress-row">
            <div class="bar-bg">
              <div class="bar-fill" style="width: {{progressPercent}}%"></div>
            </div>
          </div>

          <div class="requester-row" id="requester-row">
            <span class="req-prefix">REQ //</span>
            <img
              class="requester-pic"
              id="requester-pic"
              src="{{requesterPicture}}"
              alt=""
              onerror="this.style.display='none'"
            />
            <span class="requester-name" id="requester-name">{{requesterName}}</span>
            <span class="requester-verified" id="requester-verified" data-verified="{{isRequesterVerified}}">&#10003;</span>
            <span class="requester-badges" id="requester-badges"></span>
          </div>
        </div>
      </div>

      <div class="setlist-wrap" id="setlist">
        <div class="setlist-label" id="setlist-label">UP NEXT</div>
        <div class="setlist-body" id="setlist-body"></div>
      </div>
    </div>
  </div>

  <script>
    const isPlaying = "{{isPlaying}}" === "true";
    const isPaused = "{{isPaused}}" === "true";
    const isInGap = "{{isInGap}}" === "true";
    const gapText = "{{gapText}}".trim();
    const errorText = "{{error}}".trim();
    const requesterBadges = "{{requesterBadges}}".trim();

    const BADGE_ICON_URLS = {
      "Tako Verified Partner": "https://tako.id/images/badges/partnered-creator.png",
      "Tako Verified Creator": "https://tako.id/images/badges/verified-creator.png",
      "Rich Rich Club": "https://tako.id/images/badges/king.png",
      "Charity": "https://tako.id/images/badges/charity.png",
      "VTuber": "https://tako.id/images/badges/vtuber.png",
      "Tako Team": "https://tako.id/images/badges/admin.png"
    };

    const titleEl = document.getElementById("title-el");
    const artistEl = document.getElementById("artist-el");
    const statusEl = document.getElementById("status-el");
    const timeEl = document.getElementById("time-el");
    const errorBanner = document.getElementById("error-banner");
    const gapBanner = document.getElementById("gap-banner");
    const playerBody = document.getElementById("player-body");
    const progressRow = document.getElementById("progress-row");
    const requesterRow = document.getElementById("requester-row");
    const requesterNameEl = document.getElementById("requester-name");
    const requesterBadgesEl = document.getElementById("requester-badges");

    const titleText = titleEl.textContent.trim();
    const isIdle = !titleText || titleText === "{{" + "songTitle" + "}}";

    if (errorText && !errorText.includes("{{")) {
      errorBanner.textContent = "! " + errorText;
      errorBanner.style.display = "block";
    }

    if (isInGap) {
      playerBody.style.display = "none";
      gapBanner.textContent = gapText && !gapText.includes("{{") ? gapText : "Menyiapkan lagu berikutnya...";
      gapBanner.style.display = "block";
    } else if (isIdle) {
      statusEl.textContent = "STANDBY";
      titleEl.textContent = "NO TRACK PLAYING";
      artistEl.textContent = "READY FOR SONG REQUESTS";
      timeEl.textContent = "00:00 / 00:00";
      progressRow.style.visibility = "hidden";
      requesterRow.style.visibility = "hidden";
    } else if (isPaused) {
      statusEl.textContent = "PAUSED";
    } else if (isPlaying) {
      statusEl.textContent = "NOW PLAYING";
    } else {
      statusEl.textContent = "TRACK READY";
    }

    if (artistEl.textContent.includes("{{")) {
      artistEl.textContent = "";
    }

    const reqNameText = requesterNameEl.textContent.trim();
    if (!reqNameText || reqNameText.includes("{{")) {
      requesterRow.style.display = "none";
    }

    if (requesterBadges && !requesterBadges.includes("{{")) {
      requesterBadges.split(",").map(function (b) { return b.trim(); }).filter(Boolean).forEach(function (entry) {
        const isUrl = entry.startsWith("https://") || entry.startsWith("http://") || entry.startsWith("/");
        const iconUrl = isUrl ? entry : BADGE_ICON_URLS[entry];

        if (iconUrl) {
          const icon = document.createElement("img");
          icon.className = "req-badge-icon";
          icon.src = iconUrl;
          icon.alt = isUrl ? "Badge" : entry;
          icon.title = isUrl ? "" : entry;
          icon.onerror = function () {
            if (isUrl) {
              icon.style.display = "none";
            } else {
              const fallbackTag = document.createElement("span");
              fallbackTag.className = "req-badge-tag";
              fallbackTag.textContent = entry;
              icon.replaceWith(fallbackTag);
            }
          };
          requesterBadgesEl.appendChild(icon);
        } else {
          const tag = document.createElement("span");
          tag.className = "req-badge-tag";
          tag.textContent = entry;
          requesterBadgesEl.appendChild(tag);
        }
      });
    }
  </script>

  <script>
    try {
      const queueData = {{queue}};
      const setlist = document.getElementById("setlist");
      const setlistLabel = document.getElementById("setlist-label");
      const setlistBody = document.getElementById("setlist-body");

      if (Array.isArray(queueData) && queueData.length > 0) {
        setlist.style.display = "block";
        setlistLabel.textContent = "UP NEXT (" + queueData.length + ")";

        queueData.forEach(function (song, index) {
          const row = document.createElement("div");
          row.className = "setlist-row";

          const num = document.createElement("span");
          num.className = "setlist-num";
          num.textContent = "#" + (index + 1);

          const track = document.createElement("span");
          track.className = "setlist-track";
          track.textContent = song.title || "Untitled";
          if (song.artist) {
            const artistSpan = document.createElement("span");
            artistSpan.className = "setlist-artist";
            artistSpan.textContent = " — " + song.artist;
            track.appendChild(artistSpan);
          }

          row.appendChild(num);
          row.appendChild(track);

          if (song.senderName || (song.senderBadgeItems && song.senderBadgeItems.length > 0)) {
            const sender = document.createElement("span");
            sender.className = "setlist-sender";

            (song.senderBadgeItems || []).forEach(function (badge) {
              if (!badge || !badge.url) return;
              const icon = document.createElement("img");
              icon.className = "setlist-badge-icon";
              icon.src = badge.url;
              icon.alt = badge.title || "";
              icon.title = badge.title || "";
              icon.onerror = function () { icon.style.display = "none"; };
              sender.appendChild(icon);
            });

            if (song.senderName) {
              const sName = document.createElement("span");
              sName.className = "setlist-sender-name";
              sName.textContent = song.senderName;
              sender.appendChild(sName);
            }

            row.appendChild(sender);
          }

          setlistBody.appendChild(row);
        });
      }
    } catch (e) {}
  </script>
</body>
</html>
